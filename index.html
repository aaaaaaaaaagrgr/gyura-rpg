<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ギュラ鯖RPG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0d0f1a;
    --panel: #161a2e;
    --panel2: #1f2444;
    --accent: #ffd24a;
    --accent2: #ff5d8f;
    --ally: #4bc4ff;
    --text: #f5f6ff;
    --dim: #8a90b8;
    --hp: #4be07a;
    --hp-low: #ff5b5b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    overflow: hidden;
    height: 100%;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at top, #1a1f3a 0%, #07080f 100%);
  }
  #game {
    width: min(720px, 100vw);
    height: min(960px, 100vh);
    max-height: 100vh;
    background: var(--panel);
    border: 2px solid #2a3060;
    box-shadow: 0 0 30px rgba(0,0,0,0.6), inset 0 0 0 1px #3a4080;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  header {
    padding: 10px 16px;
    background: linear-gradient(180deg, #232a55, #1a1f44);
    border-bottom: 2px solid #3a4080;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px;
    flex-shrink: 0;
  }
  header .title { font-weight: bold; color: var(--accent); letter-spacing: 2px; }
  header .right { display:flex; gap:8px; align-items:center; }
  header .home { background:transparent; border:1px solid #3a4080; color:var(--dim); cursor:pointer; padding:3px 8px; border-radius:6px; font-size:11px; }
  header .home:hover { color: var(--text); border-color: var(--accent); }
  main { flex: 1; position: relative; overflow: hidden; }
  .scene {
    position: absolute; inset: 0;
    padding: 16px;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    overflow-y: auto;
  }
  .scene.active { opacity: 1; pointer-events: auto; }

  /* ========== Buttons ========== */
  .btn {
    background: linear-gradient(180deg, #3a4080, #232a55);
    color: var(--text);
    border: 2px solid #4a52a0;
    border-radius: 10px;
    padding: 12px 22px;
    font: inherit; font-size: 16px; font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #1a1f44, 0 6px 10px rgba(0,0,0,.4);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #1a1f44; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary {
    background: linear-gradient(180deg, #ffd24a, #d49a1e);
    color: #2a1a00; border-color: #ffe88a;
    box-shadow: 0 4px 0 #8a6a00, 0 6px 10px rgba(0,0,0,.4);
  }
  .btn.danger {
    background: linear-gradient(180deg, #ff5d8f, #b32553);
    border-color: #ff8aaf;
    box-shadow: 0 4px 0 #5a0a25, 0 6px 10px rgba(0,0,0,.4);
  }
  .btn.ally { background:linear-gradient(180deg,#4bc4ff,#2070b0); border-color:#7adfff; color:#001a2e; box-shadow:0 4px 0 #0a3a5a; }
  .btn.small { padding: 8px 14px; font-size: 13px; }

  /* ========== Title ========== */
  .title-wrap {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    gap: 16px; padding: 20px 0;
  }
  .game-title {
    font-size: clamp(36px, 8vw, 64px);
    font-weight: 900;
    color: var(--accent);
    text-shadow:
      0 0 12px rgba(255,210,74,.5),
      4px 4px 0 #b8860b,
      8px 8px 0 #5a4400;
    letter-spacing: 4px;
    line-height: 1.1;
  }
  .game-sub { color: var(--dim); font-size: 13px; letter-spacing: 6px; }
  .name-input, .text-input, .num-input, textarea.text-input {
    background: #0c0e1c;
    border: 2px solid #3a4080;
    color: var(--text);
    font: inherit; font-size: 16px;
    padding: 10px 14px;
    border-radius: 8px;
    width: 100%;
  }
  textarea.text-input { resize: vertical; min-height: 60px; font-size: 14px; }
  .name-input { text-align: center; max-width: 320px; }
  .menu-list { display: flex; flex-direction: column; gap: 10px; width: 80%; max-width: 320px; }
  .menu-list .btn { width: 100%; }
  .helper { color: var(--dim); font-size: 11px; margin-top: 4px; }

  /* ========== Gallery / Picker ========== */
  .picker-head { display: flex; align-items:center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .picker-head h2 { margin: 0; font-size: 18px; color: var(--accent); }
  .picker-head .filter { display:flex; gap:6px; }
  .picker-head .filter button {
    background: transparent; border: 1px solid #3a4080; color: var(--dim);
    padding: 4px 10px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px;
  }
  .picker-head .filter button.on { background: var(--accent); color:#2a1a00; border-color: var(--accent); font-weight:bold; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    overflow-y: auto;
    padding-bottom: 80px;
  }
  .card {
    background: var(--panel2);
    border: 2px solid #2a3060;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .1s, border-color .15s;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card.role-enemy { border-color: #4a2050; }
  .card.role-enemy:hover { border-color: var(--accent2); }
  .card.role-ally { border-color: #20446a; }
  .card.role-ally:hover { border-color: var(--ally); }
  .card .imgbox {
    width: 100%; aspect-ratio: 1/1;
    background: #0a0c18;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .card .imgbox img { width: 100%; height: 100%; object-fit: cover; }
  .card .imgbox .ph { font-size: 48px; opacity: .3; }
  .card .meta { padding: 8px; }
  .card .meta .nm { font-weight: bold; font-size: 14px; line-height: 1.2; }
  .card .meta .st { color: var(--dim); font-size: 11px; margin-top: 3px; display:flex; gap: 8px; flex-wrap: wrap; }
  .card .meta .sub { color: var(--dim); font-size: 10px; margin-top: 2px; opacity:.8; }
  .card .role-tag {
    position: relative;
    font-size: 10px; padding: 2px 6px; border-radius: 4px;
    align-self: flex-start; margin: 6px 6px 0;
    background: var(--ally); color: #001a2e; font-weight:bold;
  }
  .card.role-enemy .role-tag { background: var(--accent2); color: #2a0010; }
  .empty {
    text-align: center; color: var(--dim); font-size: 14px;
    padding: 40px 20px; line-height: 1.7;
  }

  /* ========== Submit Form ========== */
  .form-wrap { padding: 0 4px; max-width: 520px; margin: 0 auto; width: 100%; }
  .form-wrap h2 { color: var(--accent); margin: 0 0 10px; text-align:center; font-size: 20px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 4px; }
  .field label .req { color: var(--accent2); }
  .role-toggle { display: flex; gap: 8px; }
  .role-toggle label {
    flex: 1; text-align: center;
    background: var(--panel2); border: 2px solid #3a4080;
    border-radius: 10px; padding: 14px; cursor: pointer;
    font-weight: bold; transition: all .15s;
    margin: 0;
  }
  .role-toggle input { display: none; }
  .role-toggle input:checked + label { border-color: var(--accent); background: rgba(255,210,74,.1); color: var(--accent); }
  .role-toggle input[value="ally"]:checked + label { border-color: var(--ally); background: rgba(75,196,255,.1); color: var(--ally); }
  .role-toggle input[value="enemy"]:checked + label { border-color: var(--accent2); background: rgba(255,93,143,.1); color: var(--accent2); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .file-pick {
    border: 2px dashed #3a4080; border-radius: 10px; padding: 14px;
    text-align: center; cursor: pointer; background: #0a0c18;
    transition: border-color .15s;
  }
  .file-pick:hover { border-color: var(--accent); }
  .file-pick.has { border-style: solid; padding: 6px; }
  .file-pick .preview { max-width: 100%; max-height: 240px; border-radius: 6px; }
  .file-pick input { display: none; }
  .submit-bar { position: sticky; bottom: 0; background: var(--panel); padding: 10px 0 0; display:flex; gap:8px; }
  .submit-bar .btn { flex: 1; }

  /* ========== Battle ========== */
  .battle-wrap { display: flex; flex-direction: column; height: 100%; }
  .enemy-stage {
    flex: 1;
    background:
      radial-gradient(ellipse at 50% 80%, #4a2055 0%, transparent 60%),
      linear-gradient(180deg, #1a1238 0%, #0a0820 100%);
    border: 2px solid #3a2060;
    border-radius: 12px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    min-height: 220px;
  }
  .enemy-stage::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.04) 0 1px, transparent 1px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,.05) 0 1px, transparent 1px);
    background-size: 200px 200px, 250px 250px;
    pointer-events: none;
  }
  .char-sprite {
    position: relative;
    width: 70%; max-width: 320px; aspect-ratio: 3/4;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,.6));
    animation: bob 2.5s ease-in-out infinite;
    transition: transform .15s;
  }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .char-sprite img { width:100%; height:100%; object-fit: contain; border-radius: 10px; }
  .char-sprite.no-img { font-size: 100px; line-height:1; }
  .char-sprite.hurt { animation: hurt .4s; }
  @keyframes hurt {
    0%,100% { transform: translateX(0); filter: none; }
    20% { transform: translateX(-12px); filter: drop-shadow(0 0 12px #ff5b5b) hue-rotate(-30deg); }
    40% { transform: translateX(12px); filter: drop-shadow(0 0 12px #ff5b5b) hue-rotate(-30deg); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(6px); }
  }
  .char-sprite.dying { animation: die 1s forwards; }
  @keyframes die {
    0% { opacity:1; transform: scale(1) rotate(0); }
    100% { opacity:0; transform: scale(.3) rotate(180deg) translateY(60px); filter: blur(8px); }
  }
  .char-name {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.6); padding: 4px 12px; border-radius: 6px;
    font-size: 13px; font-weight: bold; white-space: nowrap;
  }
  .hp-bar-wrap { position: absolute; bottom: 10px; left: 10px; right: 10px; }
  .hp-bar {
    height: 14px; background: #0a0a18; border: 1px solid #3a4080;
    border-radius: 4px; overflow: hidden; position: relative;
  }
  .hp-bar > .fill { height: 100%; background: linear-gradient(180deg, var(--hp), #2a9050); transition: width .4s; }
  .hp-bar.low > .fill { background: linear-gradient(180deg, var(--hp-low), #802020); }
  .hp-bar.ally > .fill { background: linear-gradient(180deg, var(--ally), #2070b0); }
  .hp-bar > .txt {
    position: absolute; inset: 0; text-align: center;
    font-size: 11px; line-height: 14px; font-weight: bold;
    text-shadow: 0 0 4px #000;
  }

  .player-area {
    background: var(--panel2);
    border-top: 2px solid #3a4080;
    margin: 0 -16px; padding: 10px 16px;
    flex-shrink: 0;
  }
  .player-line {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; margin-bottom: 6px;
  }
  .player-line .avatar {
    width: 38px; height: 38px; flex-shrink: 0;
    border-radius: 6px; overflow: hidden;
    background: #0a0c18; border: 1px solid #3a4080;
    display: flex; align-items: center; justify-content: center;
  }
  .player-line .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .player-line .avatar .ph { font-size: 20px; opacity: .5; }
  .player-line .nm { font-weight: bold; font-size: 13px; min-width: 0; flex-shrink: 0; }
  .log {
    background: #0a0c18; border: 1px solid #2a3060; border-radius: 6px;
    padding: 8px 12px; font-size: 13px; line-height: 1.5;
    height: 60px; overflow-y: auto;
    margin: 6px 0;
  }
  .log .line { margin: 0; }
  .log .line.dmg { color: #ff8a8a; }
  .log .line.heal { color: #8aff9a; }
  .log .line.crit { color: var(--accent); font-weight: bold; }
  .log .line.sys { color: var(--dim); font-style: italic; }
  .cmds { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .cmds .btn { padding: 11px 8px; font-size: 14px; }

  .dmg-pop {
    position: absolute; left: 50%; top: 40%;
    transform: translate(-50%, -50%);
    font-size: 42px; font-weight: 900;
    color: var(--accent); text-shadow: 2px 2px 0 #5a3a00, 0 0 12px rgba(255,210,74,.8);
    pointer-events: none; animation: pop 1s forwards;
  }
  .dmg-pop.crit { color: var(--accent2); text-shadow: 2px 2px 0 #5a0030, 0 0 16px rgba(255,93,143,.9); font-size: 52px; }
  .dmg-pop.miss { color: var(--dim); font-size: 30px; }
  .dmg-pop.heal { color: var(--hp); text-shadow: 2px 2px 0 #0a3a20; }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(.5); }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -90%) scale(1); }
  }

  /* ========== End ========== */
  .end-wrap {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    padding: 20px;
  }
  .end-title { font-size: 36px; font-weight: 900; color: var(--accent); text-shadow: 4px 4px 0 #b8860b; }
  .end-title.bad { color: var(--accent2); text-shadow: 4px 4px 0 #5a0030; }
  .result-box {
    background: var(--panel2);
    border: 2px solid #3a4080;
    border-radius: 12px;
    padding: 14px 22px;
    min-width: 280px;
    font-size: 14px; line-height: 1.8;
  }
  .result-box .row { display: flex; justify-content: space-between; gap: 20px; }
  .result-box .row b { color: var(--accent); }
  .share-box {
    background: #0a0c18; border: 1px solid #3a4080; border-radius: 8px;
    padding: 10px 12px; font-size: 13px; font-family: ui-monospace, monospace;
    white-space: pre-wrap; text-align: left;
    width: 90%; max-width: 400px;
    color: var(--text);
  }

  /* ========== Toast ========== */
  .toast {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #1a1f44; border: 1px solid var(--accent);
    padding: 10px 18px; border-radius: 8px; z-index: 1000;
    font-size: 13px; pointer-events: none;
    opacity: 0; transition: opacity .25s, transform .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
  .toast.err { border-color: var(--accent2); }
  .spinner {
    width: 14px; height: 14px; border: 2px solid #3a4080; border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite;
    display: inline-block; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    padding: 6px 12px; text-align: center;
    color: var(--dim); font-size: 11px;
    border-top: 1px solid #2a3060;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div id="game">
  <header>
    <div class="title">🎮 ギュラ鯖RPG</div>
    <div class="right">
      <span id="stats" style="color:var(--dim);font-size:11px;"></span>
      <button class="home" id="btnHome">🏠 タイトル</button>
    </div>
  </header>
  <main>
    <!-- Title -->
    <section class="scene active" id="scene-title">
      <div class="title-wrap">
        <div class="game-title">ギュラ鯖<br>RPG</div>
        <div class="game-sub">~ みんなで作るキャラ対戦 ~</div>
        <input id="playerName" class="name-input" maxlength="12" placeholder="あなたの名前 (任意)">
        <div class="menu-list">
          <button class="btn primary" data-menu="pickAlly">⚔️ 戦う（キャラを選ぶ）</button>
          <button class="btn" data-menu="submit">📝 キャラを投稿する</button>
          <button class="btn small" data-menu="gallery">📚 みんなのキャラを見る</button>
        </div>
        <div class="helper">投稿されたキャラで自由に対戦できるよ</div>
      </div>
    </section>

    <!-- Gallery / Picker -->
    <section class="scene" id="scene-picker">
      <div class="picker-head">
        <h2 id="pickerTitle">キャラを選ぶ</h2>
        <div class="filter">
          <button data-filter="ally" class="on">⚔️ 仲間</button>
          <button data-filter="enemy">👹 敵</button>
          <button data-filter="all">全部</button>
        </div>
      </div>
      <div id="pickerHint" class="helper" style="margin-bottom:8px;"></div>
      <div class="grid" id="grid"></div>
    </section>

    <!-- Submit Form -->
    <section class="scene" id="scene-submit">
      <div class="form-wrap">
        <h2>📝 キャラを投稿</h2>
        <div class="field">
          <label>役割 <span class="req">*</span></label>
          <div class="role-toggle">
            <input type="radio" name="role" id="role-ally" value="ally" checked>
            <label for="role-ally">⚔️ 仲間<br><small style="opacity:.7;font-weight:normal;">プレイヤー側で戦う</small></label>
            <input type="radio" name="role" id="role-enemy" value="enemy">
            <label for="role-enemy">👹 敵<br><small style="opacity:.7;font-weight:normal;">相手として登場</small></label>
          </div>
        </div>
        <div class="field">
          <label>名前 <span class="req">*</span> <span style="color:var(--dim);font-size:11px;">(1〜20文字)</span></label>
          <input id="fName" class="text-input" maxlength="20" placeholder="例：勇者ロト">
        </div>
        <div class="field">
          <label>ステータス <span class="req">*</span></label>
          <div class="row2">
            <input id="fHP" class="num-input" type="number" min="1" max="9999" placeholder="HP (推奨 50-200)">
            <input id="fAtk" class="num-input" type="number" min="1" max="999" placeholder="攻撃 (5-20)">
            <input id="fDef" class="num-input" type="number" min="0" max="999" placeholder="防御 (0-10)">
          </div>
        </div>
        <div class="field">
          <label>セリフ <span style="color:var(--dim);font-size:11px;">(攻撃時に表示・1行50字以内・任意)</span></label>
          <input id="fTaunt" class="text-input" maxlength="50" placeholder="例：くらえ！必殺レス！">
        </div>
        <div class="field">
          <label>画像 <span style="color:var(--dim);font-size:11px;">(任意・5MB以下推奨・正方形がきれい)</span></label>
          <div class="file-pick" id="filePick">
            <input type="file" id="fImage" accept="image/*">
            <div id="filePickInner">📷 タップして画像を選ぶ</div>
          </div>
        </div>
        <div class="field">
          <label>投稿者名 <span style="color:var(--dim);font-size:11px;">(任意・誰が投稿したか分かる)</span></label>
          <input id="fSubmitter" class="text-input" maxlength="20" placeholder="例：かいてん">
        </div>
        <div class="submit-bar">
          <button class="btn" data-menu="title">キャンセル</button>
          <button class="btn primary" id="btnSubmit">投稿する</button>
        </div>
      </div>
    </section>

    <!-- Battle -->
    <section class="scene" id="scene-battle">
      <div class="battle-wrap">
        <div class="enemy-stage" id="enemyStage">
          <div class="char-name" id="enemyName">敵</div>
          <div class="char-sprite" id="enemySprite"></div>
          <div class="hp-bar-wrap">
            <div class="hp-bar" id="enemyHpBar">
              <div class="fill" id="enemyHpFill" style="width:100%"></div>
              <div class="txt" id="enemyHpTxt">HP 30/30</div>
            </div>
          </div>
        </div>
        <div class="player-area">
          <div class="player-line">
            <div class="avatar" id="pAvatar"><span class="ph">⚔️</span></div>
            <span class="nm" id="pName">仲間</span>
            <div class="hp-bar ally" style="flex:1">
              <div class="fill" id="playerHpFill" style="width:100%"></div>
              <div class="txt" id="playerHpTxt">HP 50/50</div>
            </div>
          </div>
          <div class="log" id="log"></div>
          <div class="cmds">
            <button class="btn" data-cmd="attack">⚔️ こうげき</button>
            <button class="btn" data-cmd="special">✨ ひっさつ (MP3)</button>
            <button class="btn" data-cmd="guard">🛡️ ぼうぎょ</button>
            <button class="btn danger" data-cmd="run">🏃 にげる</button>
          </div>
        </div>
      </div>
    </section>

    <!-- End -->
    <section class="scene" id="scene-end">
      <div class="end-wrap" id="endWrap"></div>
    </section>

    <div class="toast" id="toast"></div>
  </main>
  <footer>v0.2 / みんなで作るギュラ鯖RPG</footer>
</div>

<script>
//================= Supabase =================
const SUPABASE_URL = 'https://iulhtentzliohwylcsqo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9iTuPD3fEDazZYEMWyijWg_0WxMv_9B';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

//================= 既定キャラ（DBが空でも遊べる用のサンプル）=================
const DEFAULTS = [
  { role:'ally', name:'ふつうの勇者', hp:80, atk:10, def:3, taunt:'いくぞ！', image_url:null, submitter:'(プリセット)' },
  { role:'enemy', name:'チャットスライム', hp:40, atk:6, def:0, taunt:'ﾌﾞﾙﾙ…', image_url:null, submitter:'(プリセット)' },
];

//================= 状態 =================
const G = {
  playerName: '',
  myChar: null,    // 選択した仲間
  oppChar: null,   // 選択した敵
  characters: [],  // 全キャラ（DB + 既定）
  // バトル状態
  pHP:0, pHPMax:0, pMP:3, pMPMax:5,
  eHP:0, eHPMax:0,
  totalDmg:0, turns:0, startTime:0,
  guarding:false,
  // UI
  pickerStage:null, // 'ally' or 'enemy' or 'browse'
  pickerFilter:'ally',
};

//================= ユーティリティ =================
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const rand = (a,b)=> a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const esc = s => String(s||'').replace(/[<>&"]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));

function show(id){
  $$('.scene').forEach(s=>s.classList.remove('active'));
  $('#scene-'+id).classList.add('active');
}
function toast(msg, isErr){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 2400);
}
function updateHeader(){
  if (G.myChar && $('#scene-battle').classList.contains('active')) {
    $('#stats').textContent = `MP ${G.pMP}/${G.pMPMax}`;
  } else if (G.playerName) {
    $('#stats').textContent = G.playerName;
  } else {
    $('#stats').textContent = '';
  }
}

//================= DBアクセス =================
async function loadCharacters(){
  const { data, error } = await sb.from('characters').select('*').order('created_at', { ascending: false });
  if (error) {
    console.warn('DB error:', error);
    toast('キャラ読み込みに失敗（オフラインモード）', true);
    G.characters = [...DEFAULTS];
    return;
  }
  G.characters = [...(data||[]), ...DEFAULTS];
}

async function uploadImage(file){
  if (!file) return null;
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const safeExt = /^(jpe?g|png|gif|webp)$/.test(ext) ? ext : 'jpg';
  const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.${safeExt}`;
  const { error } = await sb.storage.from('characters').upload(path, file, {
    cacheControl: '3600', upsert: false
  });
  if (error) throw error;
  const { data } = sb.storage.from('characters').getPublicUrl(path);
  return data.publicUrl;
}

async function submitCharacter(data){
  const { error } = await sb.from('characters').insert(data);
  if (error) throw error;
}

//================= タイトル/メニュー =================
$('#btnHome').addEventListener('click', goTitle);
$$('[data-menu]').forEach(el=>{
  el.addEventListener('click', ()=>{
    const m = el.dataset.menu;
    G.playerName = ($('#playerName').value || '').trim().slice(0,12);
    if (m === 'pickAlly') goPicker('ally');
    else if (m === 'submit') goSubmit();
    else if (m === 'gallery') goPicker('browse');
    else if (m === 'title') goTitle();
  });
});

function goTitle(){
  G.myChar = null; G.oppChar = null;
  G.pickerStage = null;
  updateHeader();
  show('title');
}

//================= ピッカー =================
async function goPicker(stage){
  G.pickerStage = stage;
  G.pickerFilter = stage === 'enemy' ? 'enemy' : (stage === 'browse' ? 'all' : 'ally');
  if (stage === 'ally') {
    $('#pickerTitle').textContent = '① 自分のキャラを選ぶ';
    $('#pickerHint').innerHTML = '<span style="color:var(--ally);">仲間</span>を選んで戦闘準備しよう';
  } else if (stage === 'enemy') {
    $('#pickerTitle').textContent = `② 相手を選ぶ（自分：${esc(G.myChar.name)}）`;
    $('#pickerHint').innerHTML = '<span style="color:var(--accent2);">敵</span>を選んでバトル開始！';
  } else {
    $('#pickerTitle').textContent = '📚 みんなのキャラ';
    $('#pickerHint').textContent = '（鑑賞モード）';
  }
  // フィルタボタン状態
  $$('.picker-head .filter button').forEach(b=>{
    b.classList.toggle('on', b.dataset.filter === G.pickerFilter);
  });
  show('picker');
  // ロード（既にあれば再利用）
  if (G.characters.length === 0) {
    $('#grid').innerHTML = '<div class="empty"><div class="spinner"></div> 読み込み中…</div>';
    await loadCharacters();
  }
  renderGrid();
}

$$('.picker-head .filter button').forEach(b=>{
  b.addEventListener('click', ()=>{
    if (G.pickerStage === 'ally' || G.pickerStage === 'enemy') return; // 戦闘準備中はフィルタ固定
    G.pickerFilter = b.dataset.filter;
    $$('.picker-head .filter button').forEach(x=>x.classList.toggle('on', x.dataset.filter === G.pickerFilter));
    renderGrid();
  });
});

function renderGrid(){
  const grid = $('#grid');
  let list = G.characters;
  if (G.pickerStage === 'ally') list = list.filter(c=>c.role==='ally');
  else if (G.pickerStage === 'enemy') list = list.filter(c=>c.role==='enemy');
  else if (G.pickerFilter !== 'all') list = list.filter(c=>c.role===G.pickerFilter);
  if (list.length === 0) {
    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1;">
        まだキャラがいないみたい。<br>
        <button class="btn small" style="margin-top:10px;" data-menu="submit-link">📝 投稿してみる</button>
      </div>`;
    grid.querySelector('[data-menu="submit-link"]')?.addEventListener('click', goSubmit);
    return;
  }
  grid.innerHTML = list.map((c,i)=>`
    <div class="card role-${c.role}" data-idx="${i}">
      <div class="role-tag">${c.role==='enemy'?'敵':'仲間'}</div>
      <div class="imgbox">${c.image_url ? `<img src="${esc(c.image_url)}" alt="" loading="lazy">` : '<span class="ph">'+(c.role==='enemy'?'👹':'⚔️')+'</span>'}</div>
      <div class="meta">
        <div class="nm">${esc(c.name)}</div>
        <div class="st">HP ${c.hp} / ⚔ ${c.atk} / 🛡 ${c.def||0}</div>
        ${c.submitter ? `<div class="sub">by ${esc(c.submitter)}</div>` : ''}
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const i = +card.dataset.idx;
      const c = list[i];
      onPickCharacter(c);
    });
  });
}

function onPickCharacter(c){
  if (G.pickerStage === 'ally') {
    G.myChar = c;
    goPicker('enemy');
  } else if (G.pickerStage === 'enemy') {
    G.oppChar = c;
    startBattle();
  } else {
    // 鑑賞モード→そのキャラを敵 or 仲間として「これと戦う」促し
    if (confirm(`「${c.name}」と戦う？\n（${c.role==='enemy'?'相手':'仲間'}としてセットされます）`)) {
      if (c.role === 'ally') { G.myChar = c; goPicker('enemy'); }
      else { G.oppChar = c; goPicker('ally'); }
    }
  }
}

//================= 投稿フォーム =================
function goSubmit(){
  show('submit');
  $('#fName').value = ''; $('#fHP').value=''; $('#fAtk').value=''; $('#fDef').value='';
  $('#fTaunt').value=''; $('#fImage').value=''; $('#fSubmitter').value = G.playerName || '';
  $('#filePickInner').innerHTML = '📷 タップして画像を選ぶ';
  $('#filePick').classList.remove('has');
  $('#role-ally').checked = true;
}

$('#filePick').addEventListener('click', e=>{
  if (e.target.tagName !== 'INPUT') $('#fImage').click();
});
$('#fImage').addEventListener('change', e=>{
  const f = e.target.files[0];
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) { toast('8MB以下にしてください', true); $('#fImage').value=''; return; }
  const r = new FileReader();
  r.onload = ev => {
    $('#filePickInner').innerHTML = `<img src="${ev.target.result}" class="preview"><div style="font-size:11px;color:var(--dim);margin-top:4px;">タップで変更</div>`;
    $('#filePick').classList.add('has');
  };
  r.readAsDataURL(f);
});

$('#btnSubmit').addEventListener('click', async ()=>{
  const role = document.querySelector('input[name="role"]:checked').value;
  const name = $('#fName').value.trim();
  const hp = parseInt($('#fHP').value, 10);
  const atk = parseInt($('#fAtk').value, 10);
  const def = parseInt($('#fDef').value, 10) || 0;
  const taunt = $('#fTaunt').value.trim();
  const submitter = $('#fSubmitter').value.trim() || G.playerName || null;
  const file = $('#fImage').files[0] || null;

  if (!name) { toast('名前は必須だよ', true); return; }
  if (!(hp >= 1 && hp <= 9999)) { toast('HPは1〜9999で', true); return; }
  if (!(atk >= 1 && atk <= 999)) { toast('攻撃は1〜999で', true); return; }
  if (!(def >= 0 && def <= 999)) { toast('防御は0〜999で', true); return; }

  $('#btnSubmit').disabled = true;
  $('#btnSubmit').innerHTML = '<span class="spinner"></span> 送信中…';
  try {
    let image_url = null;
    if (file) image_url = await uploadImage(file);
    await submitCharacter({ role, name, hp, atk, def, taunt: taunt||null, image_url, submitter });
    toast('投稿しました！');
    G.characters = []; // 次のpickerでリロード
    setTimeout(()=>{ goTitle(); }, 700);
  } catch (e) {
    console.error(e);
    toast('投稿失敗：' + (e.message || e), true);
  } finally {
    $('#btnSubmit').disabled = false;
    $('#btnSubmit').textContent = '投稿する';
  }
});

//================= バトル =================
const FUNNY = {
  attackGeneric: ['{p} は {e} に つっこみを いれた！','{p} は キーボードで 殴った！','{p} の キレッキレ レスポンス！'],
  miss: ['{p} の こうげきは スルーされた…','{p} の こうげきは ROM専に かわされた！','{p} は タイポした！'],
  crit: ['💥 痛恨の 正論！','💥 限界突破の マジレス！','💥 場が 凍りつく ひとこと！'],
  enemyAtk: ['{e} は {p} に 煽りレスを ぶつけた！','{e} の マウントが 炸裂！','{e} は {p} に 既読スルーを かました！'],
  enemyMiss: ['{e} の こうげきは 圏外！','{e} は 自滅した…'],
  guard: ['{p} は 通知を ミュートした！','{p} は ROMに 徹した！','{p} は 防御の構え！'],
};
const fmt = (t, c) => t.replace('{p}', c.p).replace('{e}', c.e);

function startBattle(){
  const me = G.myChar, opp = G.oppChar;
  G.pHPMax = me.hp; G.pHP = me.hp;
  G.eHPMax = opp.hp; G.eHP = opp.hp;
  G.pMP = 3; G.pMPMax = 5;
  G.totalDmg = 0; G.turns = 0; G.startTime = Date.now();
  G.guarding = false;
  // UI
  $('#pName').textContent = me.name;
  $('#pAvatar').innerHTML = me.image_url ? `<img src="${esc(me.image_url)}" alt="">` : `<span class="ph">⚔️</span>`;
  $('#enemyName').textContent = opp.name;
  $('#enemySprite').className = 'char-sprite' + (opp.image_url ? '' : ' no-img');
  $('#enemySprite').innerHTML = opp.image_url ? `<img src="${esc(opp.image_url)}" alt="">` : '👹';
  $('#log').innerHTML = '';
  refreshBars();
  log(`▼ ${opp.name} が あらわれた！`, 'sys');
  if (opp.taunt) log(`${opp.name}「${opp.taunt}」`, 'sys');
  enableCmds(true);
  show('battle');
  updateHeader();
}

function refreshBars(){
  const ep = Math.max(0, G.eHP/G.eHPMax*100);
  $('#enemyHpFill').style.width = ep+'%';
  $('#enemyHpTxt').textContent = `HP ${Math.max(0,G.eHP)}/${G.eHPMax}`;
  $('#enemyHpBar').classList.toggle('low', ep < 30);
  const pp = Math.max(0, G.pHP/G.pHPMax*100);
  $('#playerHpFill').style.width = pp+'%';
  $('#playerHpTxt').textContent = `HP ${Math.max(0,G.pHP)}/${G.pHPMax}`;
  updateHeader();
}

function enableCmds(on){
  $$('.cmds .btn').forEach(b=>{
    b.disabled = !on;
    if (b.dataset.cmd === 'special') b.disabled = !on || G.pMP < 3;
  });
}

function log(text, cls=''){
  const p = document.createElement('p');
  p.className = 'line ' + cls;
  p.textContent = text;
  $('#log').appendChild(p);
  $('#log').scrollTop = $('#log').scrollHeight;
}

function popDmg(text, type=''){
  const stage = $('#enemyStage');
  const el = document.createElement('div');
  el.className = 'dmg-pop ' + type;
  el.textContent = text;
  stage.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}

$$('.cmds .btn').forEach(b=> b.addEventListener('click', ()=>handleCmd(b.dataset.cmd)));

async function handleCmd(cmd){
  enableCmds(false);
  G.turns++;
  const me = G.myChar, opp = G.oppChar;
  const ctx = { p: me.name, e: opp.name };

  if (cmd === 'attack') {
    const miss = Math.random() < 0.08;
    if (miss) {
      log(fmt(pick(FUNNY.miss), ctx), 'sys');
      popDmg('MISS', 'miss');
    } else {
      const crit = Math.random() < 0.18;
      let dmg = Math.max(1, me.atk - (opp.def||0) + rand(-2,3));
      if (crit) dmg = Math.floor(dmg * 1.8);
      G.eHP -= dmg; G.totalDmg += dmg;
      $('#enemySprite').classList.remove('hurt'); void $('#enemySprite').offsetWidth;
      $('#enemySprite').classList.add('hurt');
      popDmg(dmg, crit ? 'crit' : '');
      if (crit) log(pick(FUNNY.crit), 'crit');
      const taunt = me.taunt ? `「${me.taunt}」 ` : '';
      log(taunt + fmt(pick(FUNNY.attackGeneric), ctx) + ` ${dmg} のダメージ！`, 'dmg');
    }
  }
  else if (cmd === 'special') {
    if (G.pMP < 3) { enableCmds(true); return; }
    G.pMP -= 3;
    const dmg = Math.max(1, Math.floor(me.atk * 2.2) - Math.floor((opp.def||0)/2) + rand(0,6));
    G.eHP -= dmg; G.totalDmg += dmg;
    $('#enemySprite').classList.add('hurt');
    popDmg(dmg, 'crit');
    log(`✨ ${me.name} の ひっさつ「鯖の意地」！ ${dmg} のダメージ！`, 'crit');
  }
  else if (cmd === 'guard') {
    G.guarding = true;
    const heal = Math.min(G.pHPMax - G.pHP, rand(3,7));
    if (heal > 0) { G.pHP += heal; popDmg('+'+heal, 'heal'); }
    log(fmt(pick(FUNNY.guard), ctx) + (heal? ` (HPが ${heal} 回復)`:''), 'heal');
  }
  else if (cmd === 'run') {
    log('にげだした…', 'sys');
    await sleep(700);
    goTitle();
    return;
  }
  refreshBars();
  await sleep(700);
  if (G.eHP <= 0) {
    $('#enemySprite').classList.add('dying');
    log(`${opp.name} を たおした！`, 'crit');
    await sleep(900);
    endBattle(true);
    return;
  }
  await enemyTurn();
  if (G.pHP <= 0) {
    log(`${me.name} は ちからつきた…`, 'sys');
    await sleep(900);
    endBattle(false);
    return;
  }
  G.guarding = false;
  enableCmds(true);
}

async function enemyTurn(){
  const me = G.myChar, opp = G.oppChar;
  const ctx = { p: me.name, e: opp.name };
  if (Math.random() < 0.08) {
    log(fmt(pick(FUNNY.enemyMiss), ctx), 'sys');
    return;
  }
  let dmg = Math.max(1, opp.atk - (me.def||0) + rand(-2,3));
  if (G.guarding) dmg = Math.max(0, Math.floor(dmg * 0.4));
  G.pHP -= dmg;
  popDmg(dmg);
  const taunt = opp.taunt ? `「${opp.taunt}」 ` : '';
  log(taunt + fmt(pick(FUNNY.enemyAtk), ctx) + ` ${dmg} のダメージ！`, 'dmg');
  refreshBars();
}

//================= 結果 =================
function endBattle(win){
  const sec = Math.floor((Date.now() - G.startTime)/1000);
  const mm = String(Math.floor(sec/60)).padStart(2,'0');
  const ss = String(sec%60).padStart(2,'0');
  const me = G.myChar, opp = G.oppChar;
  const playerName = G.playerName || '名無しの鯖民';
  const wrap = $('#endWrap');
  wrap.innerHTML = `
    <div class="end-title ${win?'':'bad'}">${win ? '🎉 勝利！' : '💀 やられた…'}</div>
    <div style="font-size:14px;color:var(--dim);">${win ? `${esc(opp.name)} を倒した！` : `${esc(opp.name)} に やられた…`}</div>
    <div class="result-box">
      <div class="row"><span>プレイヤー</span><b>${esc(playerName)}</b></div>
      <div class="row"><span>使用キャラ</span><b>${esc(me.name)}</b></div>
      <div class="row"><span>相手</span><b>${esc(opp.name)}</b></div>
      <div class="row"><span>総ダメージ</span><b>${G.totalDmg}</b></div>
      <div class="row"><span>ターン数</span><b>${G.turns}</b></div>
      <div class="row"><span>タイム</span><b>${mm}:${ss}</b></div>
    </div>
    <textarea class="share-box" id="shareBox" rows="4" readonly>${esc(playerName)} は「${esc(me.name)}」で「${esc(opp.name)}」と戦って ${win?'勝利！':'敗北…'}\n総ダメージ ${G.totalDmg} / ${G.turns}ターン / ${mm}:${ss}\n#ギュラ鯖RPG</textarea>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
      <button class="btn" id="btnCopy">📋 結果コピー</button>
      <button class="btn ally" id="btnRematch">🔁 もう一度</button>
      <button class="btn primary" id="btnNewPick">⚔️ 別のキャラで</button>
    </div>
  `;
  $('#btnCopy').addEventListener('click', ()=>{
    const ta = $('#shareBox'); ta.select(); document.execCommand('copy');
    $('#btnCopy').textContent = '✅ コピーした';
    setTimeout(()=>$('#btnCopy').textContent = '📋 結果コピー', 1500);
  });
  $('#btnRematch').addEventListener('click', startBattle);
  $('#btnNewPick').addEventListener('click', ()=>goPicker('ally'));
  show('end');
}

// 起動時にバックグラウンドでキャラロード
loadCharacters();
</script>
</body>
</html>
