<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ギュラ鯖RPG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0a0c18;
    --panel: #14182e;
    --panel2: #1d2244;
    --accent: #ffd24a;
    --accent2: #ff3a5d;
    --ally: #4bc4ff;
    --text: #f5f6ff;
    --dim: #8a90b8;
    --hp: #4be07a;
    --hp-low: #ff5b5b;
    --mp: #5bb6ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #000;
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    overflow: hidden;
    height: 100%;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #14182e 0%, #02030a 100%);
  }
  /* ========== 16:9 container ========== */
  #game {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    max-width: 1280px; max-height: 720px;
    aspect-ratio: 16/9;
    background: var(--panel);
    border: 1px solid #2a3060;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  /* Rotate prompt for portrait mobile */
  #rotate-prompt {
    display: none;
    position: fixed; inset: 0;
    background: #02030a;
    align-items: center; justify-content: center; text-align: center;
    padding: 30px;
    z-index: 999; color: var(--text);
    font-size: 18px; line-height: 1.6;
  }
  #rotate-prompt strong { color: var(--accent); }
  #rotate-prompt .icon { font-size: 64px; animation: rotateIcon 2s ease-in-out infinite; display: inline-block; }
  @keyframes rotateIcon { 0%,100% { transform: rotate(0); } 50% { transform: rotate(90deg); } }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotate-prompt { display: flex; flex-direction: column; gap: 16px; }
    #game { display: none; }
  }

  header {
    padding: 6px 14px;
    background: rgba(0,0,0,.4);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px;
    flex-shrink: 0;
    z-index: 10;
    height: 36px;
  }
  header .title { font-weight: bold; color: var(--accent); letter-spacing: 2px; font-size: 13px; }
  header .home {
    background: transparent;
    border: 1px solid #3a4080; color: var(--dim);
    cursor: pointer; padding: 3px 10px; border-radius: 6px;
    font: inherit; font-size: 12px;
    display: flex; align-items: center; gap: 4px;
  }
  header .home:hover { color: var(--accent); border-color: var(--accent); }

  main { flex: 1; position: relative; overflow: hidden; }
  .scene {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transition: opacity .3s;
    overflow: hidden;
  }
  .scene.active { opacity: 1; pointer-events: auto; }

  /* ========== Buttons ========== */
  .btn {
    background: linear-gradient(180deg, #2a3060, #1a1f44);
    color: var(--text);
    border: 1px solid #4a52a0;
    border-radius: 8px;
    padding: 8px 14px;
    font: inherit; font-size: 13px; font-weight: bold;
    cursor: pointer;
    transition: transform .08s, filter .15s;
  }
  .btn:hover { filter: brightness(1.2); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.huge {
    padding: 14px 56px; font-size: 22px; letter-spacing: 6px;
    background: linear-gradient(180deg, #d72340 0%, #a01020 100%);
    border: 2px solid #ff5060;
    box-shadow: 0 0 24px rgba(255,80,90,.4), 0 4px 0 #5a0010;
    color: #fff;
    text-shadow: 0 1px 0 #5a0010;
  }
  .btn.huge:hover { box-shadow: 0 0 32px rgba(255,80,90,.6), 0 4px 0 #5a0010; }
  .btn.huge:active { transform: translateY(2px); box-shadow: 0 2px 0 #5a0010; }
  .btn.primary {
    background: linear-gradient(180deg, #ffd24a, #d49a1e);
    color: #2a1a00; border-color: #ffe88a;
  }
  .btn.ally { background: linear-gradient(180deg, #4bc4ff, #2070b0); border-color: #7adfff; color: #001a2e; }
  .btn.danger { background: linear-gradient(180deg, #ff3a5d, #a01020); border-color: #ff7090; }

  /* ========== Title ========== */
  #scene-title {
    background: #1a1238;
  }
  .title-bg {
    position: absolute; inset: 0;
    background-image: url('images/title/title_main.jpg');
    background-size: cover; background-position: center;
    filter: saturate(1.05);
  }
  .title-bg::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.5) 85%, rgba(0,0,0,.75) 100%);
  }
  .title-content {
    position: relative; z-index: 2;
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding: 14px 20px 22px;
    gap: 10px;
  }
  .logo, .title-cover { display: none; }

  /* Image buttons */
  .img-btn {
    background: transparent; border: 0; padding: 0;
    cursor: pointer; position: relative;
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,.6));
    transition: transform .1s, filter .15s;
  }
  .img-btn:hover { filter: brightness(1.1) drop-shadow(0 6px 16px rgba(0,0,0,.7)); transform: translateY(-2px); }
  .img-btn:active { transform: translateY(1px); }
  .img-btn img { display: block; max-width: 100%; height: auto; pointer-events: none; }
  .img-btn .state-pressed {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0; transition: opacity .08s;
  }
  .img-btn:active .state-pressed { opacity: 1; }
  .img-btn:active .state-normal { opacity: 0; }
  .btn-battle { width: clamp(240px, 28vw, 360px); }
  .title-sub { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btn-sub { width: clamp(140px, 16vw, 200px); }
  .title-name {
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,210,74,.5);
    backdrop-filter: blur(6px);
    color: var(--text); font: inherit; font-size: 13px;
    padding: 6px 14px; border-radius: 6px; text-align: center;
    width: 240px;
    margin-bottom: 4px;
  }
  .title-name::placeholder { color: rgba(255,255,255,.4); }
  .title-actions {
    display: flex; flex-direction: column;
    align-items: center; gap: 16px;
  }
  .title-name {
    background: rgba(0,0,0,.5); border: 1px solid #3a4080;
    color: var(--text); font: inherit; font-size: 14px;
    padding: 8px 14px; border-radius: 6px; text-align: center;
    width: 260px;
  }
  .title-name::placeholder { color: var(--dim); }
  .title-menu-row {
    display: flex; gap: 10px;
  }
  .title-menu-row .btn { font-size: 12px; padding: 8px 14px; }

  /* ========== Picker ========== */
  #scene-picker { padding: 14px 20px; }
  .picker-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .picker-head h2 { margin: 0; font-size: 16px; color: var(--accent); }
  .filter { display: flex; gap: 6px; }
  .filter button {
    background: rgba(0,0,0,.3); border: 1px solid #3a4080; color: var(--dim);
    padding: 4px 12px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px;
  }
  .filter button.on { background: var(--accent); color: #2a1a00; border-color: var(--accent); font-weight: bold; }
  .picker-hint { color: var(--dim); font-size: 11px; margin-bottom: 8px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
    overflow-y: auto;
    padding-bottom: 20px;
    flex: 1;
  }
  .card {
    background: var(--panel2);
    border: 2px solid #2a3060;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .1s, border-color .15s;
    display: flex; flex-direction: column;
    position: relative;
  }
  .card:hover { transform: translateY(-2px); }
  .card.role-enemy { border-color: #5a2040; }
  .card.role-enemy:hover { border-color: var(--accent2); }
  .card.role-ally { border-color: #20446a; }
  .card.role-ally:hover { border-color: var(--ally); }
  .card .imgbox {
    width: 100%; aspect-ratio: 1/1;
    background: #0a0c18;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .card .imgbox img { width: 100%; height: 100%; object-fit: cover; }
  .card .imgbox .ph { font-size: 40px; opacity: .3; }
  .card .meta { padding: 6px 8px; }
  .card .meta .nm { font-weight: bold; font-size: 12px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta .st { color: var(--dim); font-size: 10px; margin-top: 2px; }
  .card .meta .sub { color: var(--dim); font-size: 9px; opacity: .7; }
  .card .role-tag {
    position: absolute; top: 4px; left: 4px;
    font-size: 9px; padding: 1px 5px; border-radius: 3px;
    background: var(--ally); color: #001a2e; font-weight: bold;
  }
  .card.role-enemy .role-tag { background: var(--accent2); color: #fff; }
  .empty {
    grid-column: 1/-1;
    text-align: center; color: var(--dim); font-size: 13px;
    padding: 40px 20px; line-height: 1.7;
  }

  /* ========== Submit Wizard ========== */
  #scene-submit { padding: 14px 22px; }
  .wizard { height: 100%; display: flex; flex-direction: column; max-width: 1000px; margin: 0 auto; }
  .wizard-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 1px solid #3a4080;
  }
  .wizard-header h2 { color: var(--accent); margin: 0; font-size: 17px; }
  .page-indicator {
    font-size: 12px; color: var(--dim);
    background: rgba(255,210,74,.1); border: 1px solid rgba(255,210,74,.3);
    padding: 4px 10px; border-radius: 12px;
  }
  .wizard-body { flex: 1; overflow-y: auto; padding: 4px 2px; }
  .wizard-page { display: none; }
  .wizard-page.active { display: block; }
  .page-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .page-col { display: flex; flex-direction: column; gap: 10px; }
  .page-col h3 { color: var(--accent); font-size: 13px; margin: 0 0 4px; letter-spacing: 2px; }
  .field { margin: 0; }
  .field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 3px; }
  .field label .req { color: var(--accent2); }
  .text-input, .num-input {
    background: rgba(0,0,0,.3);
    border: 1px solid #3a4080;
    color: var(--text);
    font: inherit; font-size: 13px;
    padding: 8px 11px;
    border-radius: 6px;
    width: 100%;
  }
  .text-input:focus, .num-input:focus { outline: none; border-color: var(--accent); }
  .role-toggle { display: flex; gap: 6px; }
  .role-toggle label {
    flex: 1; text-align: center;
    background: var(--panel2); border: 2px solid #3a4080;
    border-radius: 8px; padding: 8px 6px; cursor: pointer;
    font-weight: bold; transition: all .15s; font-size: 13px; margin: 0;
  }
  .role-toggle input { display: none; }
  .role-toggle input:checked + label { border-color: var(--accent); background: rgba(255,210,74,.12); color: var(--accent); }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .bg-toggle {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text);
    background: rgba(75,196,255,.08); border: 1px solid rgba(75,196,255,.3);
    padding: 7px 11px; border-radius: 6px; cursor: pointer;
    margin: 0 0 6px;
  }
  .bg-toggle input { cursor: pointer; }
  .file-pick {
    border: 2px dashed #3a4080; border-radius: 8px; padding: 16px 10px;
    text-align: center; cursor: pointer; background: rgba(0,0,0,.2);
    transition: border-color .15s;
    min-height: 180px;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
  }
  .file-pick:hover { border-color: var(--accent); }
  .file-pick.has { border-style: solid; padding: 6px; }
  .file-pick .preview { max-width: 100%; max-height: 240px; border-radius: 6px; display: block; margin: 0 auto; }
  .file-pick input { display: none; }
  .wizard-footer {
    display: flex; gap: 8px; padding-top: 10px; margin-top: 8px;
    border-top: 1px solid #3a4080;
  }
  .wizard-footer .btn { flex: 1; padding: 10px; font-size: 14px; }

  /* Preview (page 3) */
  .preview-grid { display: grid; grid-template-columns: 280px 1fr; gap: 22px; align-items: start; }
  .preview-img {
    background: rgba(0,0,0,.3); border: 1px solid #3a4080;
    border-radius: 10px; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .preview-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .preview-img .ph { color: var(--dim); font-size: 13px; }
  .preview-info { display: flex; flex-direction: column; gap: 8px; }
  .preview-info h3 { color: var(--accent); margin: 0; font-size: 22px; }
  .preview-row {
    display: flex; gap: 10px; font-size: 13px;
    padding: 6px 12px; background: rgba(0,0,0,.25);
    border: 1px solid #2a3060; border-radius: 6px;
  }
  .preview-row .k { color: var(--dim); min-width: 70px; }
  .preview-row .v { color: var(--text); }
  .preview-edits { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .preview-edits .btn { font-size: 12px; padding: 6px 12px; }

  /* ========== Battle ========== */
  #scene-battle { display: flex; flex-direction: column; }
  .battle-wrap { position: relative; flex: 1; overflow: hidden; }
  .battle-stage {
    position: absolute; inset: 0;
    overflow: hidden;
    background: #0a0a14 center/cover no-repeat;
  }
  .battle-bg-img {
    position: absolute; inset: 0;
    background-size: cover; background-position: center bottom;
    filter: brightness(.85) saturate(1.05);
  }
  .battle-bg-img::after {
    content: ""; position: absolute; inset: 0;
    background: transparent;
  }
  .char-slot {
    position: absolute;
    bottom: 30%;
    width: 30%;
    height: 65%;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .char-slot.ally { left: 11%; }
  .char-slot.enemy { right: 11%; }
  .char-sprite {
    width: 100%;
    height: 100%;
    display: flex; align-items: flex-end; justify-content: center;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,.6));
    animation: bob 3s ease-in-out infinite;
    transition: filter .2s;
  }
  .char-sprite img { width: calc(100% * var(--char-size, 1)); height: calc(100% * var(--char-size, 1)); object-fit: contain; object-position: center bottom; display: block; }
  .char-sprite.no-img { font-size: 140px; line-height: 1; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .char-sprite.hurt { animation: hurt .4s; }
  @keyframes hurt {
    0%, 100% { transform: translateX(0); filter: none; }
    20% { transform: translateX(-10px); filter: drop-shadow(0 0 12px #ff5b5b) hue-rotate(-30deg) brightness(1.5); }
    40% { transform: translateX(10px); filter: drop-shadow(0 0 12px #ff5b5b) hue-rotate(-30deg) brightness(1.5); }
    60% { transform: translateX(-6px); filter: drop-shadow(0 0 12px #ff5b5b); }
    80% { transform: translateX(4px); }
  }
  .char-sprite.dying { animation: die 1s forwards; }
  @keyframes die {
    0% { opacity: 1; transform: scale(1) rotate(0); }
    100% { opacity: 0; transform: scale(.3) rotate(180deg) translateY(60px); filter: blur(8px); }
  }

  /* Speech bubble (漫画風) */
  .bubble {
    position: absolute;
    bottom: 75%;
    background: #fff;
    color: #111;
    padding: 10px 18px;
    border: 3px solid #111;
    border-radius: 22px;
    font-size: clamp(13px, 1.4vw, 18px);
    font-weight: bold;
    min-width: 80px;
    max-width: 130%;
    white-space: pre-wrap;
    box-shadow: 4px 4px 0 rgba(0,0,0,.45);
    z-index: 50;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    line-height: 1.3;
    font-family: "Comic Sans MS", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  }
  .bubble.show { opacity: 1; }
  /* しっぽ (黒縁) */
  .bubble::before {
    content: ""; position: absolute;
    bottom: -16px; width: 0; height: 0;
    border: 10px solid transparent;
    border-top-color: #111;
  }
  /* しっぽ (白塗り) */
  .bubble::after {
    content: ""; position: absolute;
    bottom: -10px; width: 0; height: 0;
    border: 7px solid transparent;
    border-top-color: #fff;
  }
  .char-slot.ally .bubble {
    left: 60%; transform: translateX(-30%) translateY(8px) scale(.85);
  }
  .char-slot.ally .bubble.show { transform: translateX(-30%) translateY(0) scale(1); }
  .char-slot.ally .bubble::before { left: 22%; }
  .char-slot.ally .bubble::after { left: calc(22% + 3px); }
  .char-slot.enemy .bubble {
    right: 60%; transform: translateX(30%) translateY(8px) scale(.85);
  }
  .char-slot.enemy .bubble.show { transform: translateX(30%) translateY(0) scale(1); }
  .char-slot.enemy .bubble::before { right: 22%; }
  .char-slot.enemy .bubble::after { right: calc(22% + 3px); }

  /* HUD - HP/MP top corners */
  .hud {
    position: absolute;
    top: 14px;
    padding: 6px 14px;
    z-index: 5;
    min-width: clamp(280px, 30vw, 420px);
    text-shadow: 1px 1px 0 #000, 0 0 6px rgba(0,0,0,.9);
  }
  .hud.ally { left: 14px; }
  .hud.enemy { right: 14px; text-align: right; }
  .hud .nm { font-size: clamp(15px, 1.7vw, 20px); font-weight: bold; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud.ally .nm { color: var(--ally); }
  .hud.enemy .nm { color: var(--accent2); }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: clamp(11px, 1.2vw, 14px); margin: 4px 0; font-weight: bold; }
  .bar-row .lbl { color: var(--dim); width: 24px; }
  .hud.enemy .bar-row { flex-direction: row-reverse; }
  .bar {
    flex: 1; height: clamp(8px, 1.0vw, 11px);
    background: #0a0a18;
    border: 1px solid #3a4080;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .bar > .fill { height: 100%; transition: width .4s; }
  .bar.hp > .fill { background: linear-gradient(180deg, var(--hp), #2a9050); }
  .bar.hp.low > .fill { background: linear-gradient(180deg, var(--hp-low), #802020); }
  .bar.mp > .fill { background: linear-gradient(180deg, var(--mp), #2070b0); }
  .bar.tp > .fill { background: linear-gradient(180deg, var(--accent), #b8860b); }
  .bar .num { color: var(--text); font-size: clamp(11px, 1.2vw, 14px); min-width: 70px; text-align: center; text-shadow: 0 0 4px #000; font-weight: bold; }
  .hud.enemy .bar .num { text-align: center; }

  /* Battle UI overlay (背景の上に重なる) */
  .battle-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 10;
    display: flex; flex-direction: column;
    pointer-events: none;
  }
  .battle-overlay > * { pointer-events: auto; }
  .log {
    margin: 0 16px 8px;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px;
    padding: 10px 18px;
    font-size: clamp(16px, 1.8vw, 22px);
    font-weight: bold;
    line-height: 1.3;
    height: clamp(40px, 5.5vw, 60px);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    display: flex; align-items: center;
    color: var(--text);
  }
  .cmds-area {
    padding: 10px 24px;
  }
  .log .line { margin: 0; }
  .log .line.dmg { color: #ff9090; }
  .log .line.heal { color: #8aff9a; }
  .log .line.crit { color: var(--accent); font-weight: bold; }
  .log .line.sys { color: var(--dim); font-style: italic; }
  .cmds {
    display: flex;
    justify-content: space-around;
    align-items: center;
    gap: clamp(14px, 3.5vw, 50px);
  }
  .cmd-btn { width: clamp(80px, 12vw, 140px); aspect-ratio: 1; }
  .cmd-btn:disabled { opacity: .4; cursor: not-allowed; }
  .cmd-btn:disabled:hover { transform: none; filter: drop-shadow(0 4px 12px rgba(0,0,0,.6)); }

  /* Damage popup */
  .dmg-pop {
    position: absolute;
    font-size: 36px; font-weight: 900;
    color: var(--accent);
    text-shadow: 2px 2px 0 #5a3a00, 0 0 12px rgba(255,210,74,.8);
    pointer-events: none;
    animation: pop 1s forwards;
    z-index: 4;
  }
  .dmg-pop.crit { color: var(--accent2); text-shadow: 2px 2px 0 #5a0030; font-size: 48px; }

// 画像の枠から繋がってる背景色を塗りつぶし方式で透明化＋自動クロップ
// （キャラ内部の白い目とか歯は消えない）
async function removeBgAndCrop(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => {
      try {
        const w = img.naturalWidth, h = img.naturalHeight;
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        // 背景色を四隅・各辺中央からサンプリング
        const get = (x,y) => { const i = (y*w+x)*4; return [d[i], d[i+1], d[i+2]]; };
        const samples = [
          get(0,0), get(w-1,0), get(0,h-1), get(w-1,h-1),
          get(Math.floor(w/2),0), get(Math.floor(w/2),h-1),
          get(0,Math.floor(h/2)), get(w-1,Math.floor(h/2)),
        ];
        const bg = [0,1,2].map(c => Math.round(samples.reduce((s,p)=>s+p[c],0)/samples.length));
        const tol = 32, soft = 60;
        const pixelDist = (px, py) => {
          const i = (py*w+px)*4;
          return Math.sqrt((d[i]-bg[0])**2 + (d[i+1]-bg[1])**2 + (d[i+2]-bg[2])**2);
        };
        // flood-fill：枠の背景ピクセルから塗りつぶし（スタックでDFS）
        const visited = new Uint8Array(w*h);
        const stack = [];
        const pushBorder = (x, y) => {
          if (pixelDist(x, y) < tol) {
            const pos = y * w + x;
            if (!visited[pos]) { stack.push(pos); visited[pos] = 1; }
          }
        };
        for (let x = 0; x < w; x++) { pushBorder(x, 0); pushBorder(x, h-1); }
        for (let y = 0; y < h; y++) { pushBorder(0, y); pushBorder(w-1, y); }
        while (stack.length > 0) {
          const pos = stack.pop();
          const x = pos % w;
          const y = (pos - x) / w;
          const dist = pixelDist(x, y);
          const i = pos * 4;
          if (dist < tol) {
            d[i+3] = 0;
          } else {
            d[i+3] = Math.round(((dist - tol) / (soft - tol)) * 255);
            continue; // soft帯のフチは透明にせず先進めない
          }
          // 4近傍
          if (x > 0) {
            const np = pos - 1;
            if (!visited[np] && pixelDist(x-1, y) < soft) { stack.push(np); visited[np] = 1; }
          }
          if (x < w-1) {
            const np = pos + 1;
            if (!visited[np] && pixelDist(x+1, y) < soft) { stack.push(np); visited[np] = 1; }
          }
          if (y > 0) {
            const np = pos - w;
            if (!visited[np] && pixelDist(x, y-1) < soft) { stack.push(np); visited[np] = 1; }
          }
          if (y < h-1) {
            const np = pos + w;
            if (!visited[np] && pixelDist(x, y+1) < soft) { stack.push(np); visited[np] = 1; }
          }
        }
        // 自動クロップ：透明じゃないピクセルのbbox
        let minX = w, minY = h, maxX = -1, maxY = -1;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y*w+x)*4;
            if (d[i+3] > 60) {
              if (x < minX) minX = x;
              if (y < minY) minY = y;
              if (x > maxX) maxX = x;
              if (y > maxY) maxY = y;
            }
          }
        }
        if (maxX < 0) throw new Error('キャラが検出できず');
        ctx.putImageData(imgData, 0, 0);
        const pad = 6;
        const cx = Math.max(0, minX - pad);
        const cy = Math.max(0, minY - pad);
        const cw = Math.min(w - cx, maxX - minX + 1 + pad*2);
        const ch = Math.min(h - cy, maxY - minY + 1 + pad*2);
        const out = document.createElement('canvas');
        out.width = cw; out.height = ch;
        out.getContext('2d').drawImage(canvas, cx, cy, cw, ch, 0, 0, cw, ch);
        out.toBlob(blob => {
          URL.revokeObjectURL(img.src);
          if (!blob) return reject(new Error('変換失敗'));
          const newName = file.name.replace(/\.[^.]+$/, '') + '_cut.png';
          resolve(new File([blob], newName, { type: 'image/png' }));
        }, 'image/png');
      } catch (err) { URL.revokeObjectURL(img.src); reject(err); }
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); reject(new Error('画像読み込みエラー')); };
    img.src = URL.createObjectURL(file);
  });
}

// 画像リサイズ（透過PNGはPNG維持、それ以外はJPEG化）
async function resizeImage(file, maxDim = 1024, quality = 0.85){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      const longSide = Math.max(width, height);
      if (longSide <= maxDim && file.size <= 500_000) {
        URL.revokeObjectURL(img.src);
        return resolve(file);
      }
      if (longSide > maxDim) {
        const scale = maxDim / longSide;
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, width, height);
      const outType = (file.type === 'image/png') ? 'image/png' : 'image/jpeg';
      const newName = file.name.replace(/\.[^.]+$/, '') + (outType === 'image/png' ? '.png' : '.jpg');
      canvas.toBlob(blob => {
        URL.revokeObjectURL(img.src);
        if (!blob) return reject(new Error('Canvas変換に失敗'));
        resolve(new File([blob], newName, { type: outType, lastModified: Date.now() }));
      }, outType, quality);
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); reject(new Error('画像の読み込みに失敗')); };
    img.src = URL.createObjectURL(file);
  });
}

async function processPickedFile(){
  const inp = $('#fImage');
  const f = inp.files[0]; if (!f) return;
  if (f.size > 30 * 1024 * 1024) { toast('30MB超は無理ぃ…', true); inp.value=''; return; }
  $('#filePickInner').innerHTML = '<div class="spinner"></div> 画像を処理中…';
  try {
    let result = await resizeImage(f, 1024, 0.85);
    const stepLabels = [];
    if (result !== f) stepLabels.push('縮小');
    if ($('#fBgRemove').checked) {
      try {
        result = await removeBgAndCrop(result);
        stepLabels.push('背景透過');
      } catch (e) {
        toast('背景透過 失敗：' + e.message, true);
      }
    }
    pickedFile = result;
    const r = new FileReader();
    r.onload = ev => {
      const origKB = Math.round(f.size / 1024);
      const newKB = Math.round(pickedFile.size / 1024);
      const note = stepLabels.length ? `${stepLabels.join('+')} ${origKB}KB→${newKB}KB` : `${newKB}KB`;
      $('#filePickInner').innerHTML = `<img src="${ev.target.result}" class="preview"><div style="font-size:11px;color:var(--dim);margin-top:4px;">タップで変更 (${note})</div>`;
      $('#filePick').classList.add('has');
    };
    r.readAsDataURL(pickedFile);
  } catch (err) {
    console.error(err);
    toast('画像処理失敗: ' + err.message, true);
    pickedFile = null;
    $('#filePickInner').innerHTML = '📷 タップして画像を選ぶ';
    $('#filePick').classList.remove('has');
  }
}

const FUNNY = {
  attackGeneric: ['{p} は {e} に つっこみを いれた！','{p} は キーボードで 殴った！','{p} の キレッキレ レスポンス！','{p} の 痛烈マジレス！'],

function popDmg(text, type='', side='enemy'){
  const stage = $('#battleStage');
  const slot = stage.querySelector('.char-slot.' + side);
  const r = slot.getBoundingClientRect();
  const sr = stage.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'dmg-pop ' + type;
  el.textContent = text;
  el.style.left = (r.left - sr.left + r.width/2 - 20) + 'px';
  el.style.top = (r.top - sr.top + r.height*0.3) + 'px';
  stage.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}

$$('.cmds .cmd-btn').forEach(b=> b.addEventListener('click', ()=>handleCmd(b.dataset.cmd)));

async function handleCmd(cmd){
  enableCmds(false);
  G.turns++;
  const me = G.myChar, opp = G.oppChar;
  const ctx = { p: me.name, e: opp.name };

  if (cmd === 'attack') {
    if (me.taunt) showBubble('ally', me.taunt);
    const miss = Math.random() < 0.08;
    if (miss) {
      log(fmt(pick(FUNNY.miss), ctx), 'sys');
      popDmg('MISS', 'miss');
    } else {
      const crit = Math.random() < 0.18;
      let dmg = Math.max(1, me.atk - (opp.def||0) + rand(-2,3));
      if (crit) dmg = Math.floor(dmg * 1.8);
      G.eHP -= dmg; G.totalDmg += dmg;
      $('#enemySprite').classList.remove('hurt'); void $('#enemySprite').offsetWidth;
      $('#enemySprite').classList.add('hurt');
      popDmg(dmg, crit ? 'crit' : '');
      if (crit) log(pick(FUNNY.crit), 'crit');
      log(fmt(pick(FUNNY.attackGeneric), ctx) + ` ${dmg} のダメージ！`, 'dmg');
    }
  }
  else if (cmd === 'magic') {
    // キャラ固有のとくぎ（無ければデフォルトのまほう）
    const tech = (Array.isArray(me.techs) && me.techs[0]) || { name:'まほう', type:'attack', cost:3, power:2.2 };
    if (G.pMP < tech.cost) { enableCmds(true); return; }
    G.pMP -= tech.cost;
    showBubble('ally', '✨ ' + tech.name + '！');
    if (tech.type === 'heal') {
      const heal = Math.min(G.pHPMax - G.pHP, Math.max(1, Math.floor(me.hp * tech.power * 0.15)));
      G.pHP += heal;
      popDmg('+'+heal, 'heal', 'ally');
      log(`💚 ${me.name} の ${tech.name}！ HP ${heal} 回復！`, 'heal');
    } else {
      const dmg = Math.max(1, Math.floor(me.atk * tech.power) - Math.floor((opp.def||0)/2) + rand(0,6));
      G.eHP -= dmg; G.totalDmg += dmg;
      $('#enemySprite').classList.remove('hurt'); void $('#enemySprite').offsetWidth;
      $('#enemySprite').classList.add('hurt');
      popDmg(dmg, 'crit');
      log(`✨ ${me.name} の ${tech.name}！ ${dmg} のダメージ！`, 'crit');
    }
  }
  else if (cmd === 'tokugi') {
    if (G.pTP < 30) { enableCmds(true); return; }
    G.pTP -= 30;
    showBubble('ally', '⚡ とくぎ！');
    const dmg = Math.max(1, Math.floor(me.atk * 1.8) - Math.floor((opp.def||0)/2) + rand(2,6));
    G.eHP -= dmg; G.totalDmg += dmg;
    $('#enemySprite').classList.remove('hurt'); void $('#enemySprite').offsetWidth;
    $('#enemySprite').classList.add('hurt');
    popDmg(dmg, 'crit');
    log(`⚡ ${me.name} の とくぎ炸裂！ ${dmg} のダメージ！`, 'crit');
  }
  else if (cmd === 'run') {
    log('にげだした…', 'sys');
    await sleep(700);
    goTitle();
    return;
  }
  refreshBars();
  await sleep(700);
  if (G.eHP <= 0) {
    $('#enemySprite').classList.add('dying');
    log(`${opp.name} を たおした！`, 'crit');
    await sleep(900);
    endBattle(true);
    return;
  }
  await enemyTurn();
  if (G.pHP <= 0) {
    log(`${me.name} は ちからつきた…`, 'sys');
    await sleep(900);
    endBattle(false);
    return;
  }
  G.guarding = false;
  enableCmds(true);
}
async function enemyTurn(){
  const me = G.myChar, opp = G.oppChar;
  const ctx = { p: me.name, e: opp.name };
  if (Math.random() < 0.08) {
    log(fmt(pick(FUNNY.enemyMiss), ctx), 'sys');
    return;
  }
  if (opp.taunt && Math.random() < 0.4) showBubble('enemy', opp.taunt);
  let dmg = Math.max(1, opp.atk - (me.def||0) + rand(-2,3));
  if (G.guarding) dmg = Math.max(0, Math.floor(dmg * 0.4));
  G.pHP -= dmg;
  // ダメージを受けたらTP上昇
  G.pTP = Math.min(G.pTPMax, G.pTP + rand(15, 25));
  popDmg(dmg, '', 'ally');
  $('#allySprite').classList.remove('hurt'); void $('#allySprite').offsetWidth;
  $('#allySprite').classList.add('hurt');
  log(fmt(pick(FUNNY.enemyAtk), ctx) + ` ${dmg} のダメージ！`, 'dmg');
  refreshBars();
}

      <div class="row"><span>相手</span><b>${esc(opp.name)}</b></div>
      <div class="row"><span>総ダメージ</span><b>${G.totalDmg}</b></div>
      <div class="row"><span>ターン</span><b>${G.turns}</b></div>
      <div class="row"><span>タイム</span><b>${mm}:${ss}</b></div>
    </div>
    <textarea class="share-box" id="shareBox" rows="3" readonly>${esc(pn)} は「${esc(me.name)}」で「${esc(opp.name)}」と戦って ${win?'勝利！':'敗北…'}\n総ダメージ ${G.totalDmg} / ${G.turns}ターン / ${mm}:${ss}\n#ギュラ鯖RPG</textarea>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
      <button class="btn" id="btnCopy">📋 結果コピー</button>
      <button class="btn ally" id="btnRematch">🔁 もう一度</button>
      <button class="btn primary" id="btnNewPick">⚔ 別のキャラで</button>
    </div>`;
  $('#btnCopy').addEventListener('click', ()=>{
    const ta = $('#shareBox'); ta.select(); document.execCommand('copy');
    $('#btnCopy').textContent = '✅ コピーした';
    setTimeout(()=>$('#btnCopy').textContent = '📋 結果コピー', 1500);
  });
  $('#btnRematch').addEventListener('click', startBattle);
  $('#btnNewPick').addEventListener('click', ()=>goPicker('ally'));
  show('end');
}

// バックグラウンドでキャラロード（先取り）
loadCharacters();
</script>
</body>
</html>
