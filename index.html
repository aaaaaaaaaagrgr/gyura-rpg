<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ギュラ鯖RPG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0a0c18;
    --panel: #14182e;
    --panel2: #1d2244;
    --accent: #ffd24a;
    --accent2: #ff3a5d;
    --ally: #4bc4ff;
    --text: #f5f6ff;
    --dim: #8a90b8;
    --hp: #4be07a;
    --hp-low: #ff5b5b;
    --mp: #5bb6ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #000;
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    overflow: hidden;
    height: 100%;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #14182e 0%, #02030a 100%);
  }
  /* ========== 16:9 container ========== */
  #game {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    max-width: 1280px; max-height: 720px;
    aspect-ratio: 16/9;
    background: var(--panel);
    border: 1px solid #2a3060;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  /* Rotate prompt for portrait mobile */
  #rotate-prompt {
    display: none;
    position: fixed; inset: 0;
    background: #02030a;
    align-items: center; justify-content: center; text-align: center;
    padding: 30px;
    z-index: 999; color: var(--text);
    font-size: 18px; line-height: 1.6;
  }
  #rotate-prompt strong { color: var(--accent); }
  #rotate-prompt .icon { font-size: 64px; animation: rotateIcon 2s ease-in-out infinite; display: inline-block; }
  @keyframes rotateIcon { 0%,100% { transform: rotate(0); } 50% { transform: rotate(90deg); } }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotate-prompt { display: flex; flex-direction: column; gap: 16px; }
    #game { display: none; }
  }

  header {
    padding: 6px 14px;
    background: rgba(0,0,0,.4);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px;
    flex-shrink: 0;
    z-index: 10;
    height: 36px;
  }
  header .title { font-weight: bold; color: var(--accent); letter-spacing: 2px; font-size: 13px; }
  header .home {
    background: transparent;
    border: 1px solid #3a4080; color: var(--dim);
    cursor: pointer; padding: 3px 10px; border-radius: 6px;
    font: inherit; font-size: 12px;
    display: flex; align-items: center; gap: 4px;
  }
  header .home:hover { color: var(--accent); border-color: var(--accent); }

  main { flex: 1; position: relative; overflow: hidden; }
  .scene {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transition: opacity .3s;
    overflow: hidden;
  }
  .scene.active { opacity: 1; pointer-events: auto; }

  /* ========== Buttons ========== */
  .btn {
    background: linear-gradient(180deg, #2a3060, #1a1f44);
    color: var(--text);
    border: 1px solid #4a52a0;
    border-radius: 8px;
    padding: 8px 14px;
    font: inherit; font-size: 13px; font-weight: bold;
    cursor: pointer;
    transition: transform .08s, filter .15s;
  }
  .btn:hover { filter: brightness(1.2); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.huge {
    padding: 14px 56px; font-size: 22px; letter-spacing: 6px;
    background: linear-gradient(180deg, #d72340 0%, #a01020 100%);
    border: 2px solid #ff5060;
    box-shadow: 0 0 24px rgba(255,80,90,.4), 0 4px 0 #5a0010;
    color: #fff;
    text-shadow: 0 1px 0 #5a0010;
  }
  .btn.huge:hover { box-shadow: 0 0 32px rgba(255,80,90,.6), 0 4px 0 #5a0010; }
  .btn.huge:active { transform: translateY(2px); box-shadow: 0 2px 0 #5a0010; }
  .btn.primary {
    background: linear-gradient(180deg, #ffd24a, #d49a1e);
    color: #2a1a00; border-color: #ffe88a;
  }
  .btn.ally { background: linear-gradient(180deg, #4bc4ff, #2070b0); border-color: #7adfff; color: #001a2e; }
  .btn.danger { background: linear-gradient(180deg, #ff3a5d, #a01020); border-color: #ff7090; }

  /* ========== Title ========== */
  #scene-title {
    background: #1a1238;
  }
  .title-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    filter: brightness(.55) blur(1px) saturate(1.1);
    transition: opacity .4s;
  }
  .title-bg::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,.5) 80%),
      linear-gradient(180deg, rgba(0,0,0,.4) 0%, transparent 30%, rgba(0,0,0,.6) 100%);
  }
  .title-content {
    position: relative; z-index: 2;
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 24px 20px;
  }
  .logo {
    font-size: clamp(40px, 7vw, 80px);
    font-weight: 900;
    color: var(--accent);
    text-shadow:
      0 0 16px rgba(255,210,74,.7),
      3px 3px 0 #b8860b,
      6px 6px 0 #5a4400,
      0 0 30px rgba(255,210,74,.3);
    letter-spacing: 6px;
    line-height: 1;
    text-align: center;
  }
  .logo small {
    display: block; font-size: 0.35em;
    color: #d4b04a; text-shadow: 2px 2px 0 #5a4400;
    letter-spacing: 4px; margin-top: 6px;
  }
  .title-cover {
    flex: 1; display: flex; align-items: center; justify-content: center;
    width: 100%;
  }
  .title-cover img {
    max-height: 100%;
    max-width: 280px;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,0,0,.8), 0 0 0 1px rgba(255,210,74,.3);
  }
  .title-actions {
    display: flex; flex-direction: column;
    align-items: center; gap: 16px;
  }
  .title-name {
    background: rgba(0,0,0,.5); border: 1px solid #3a4080;
    color: var(--text); font: inherit; font-size: 14px;
    padding: 8px 14px; border-radius: 6px; text-align: center;
    width: 260px;
  }
  .title-name::placeholder { color: var(--dim); }
  .title-menu-row {
    display: flex; gap: 10px;
  }
  .title-menu-row .btn { font-size: 12px; padding: 8px 14px; }

  /* ========== Picker ========== */
  #scene-picker { padding: 14px 20px; }
  .picker-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .picker-head h2 { margin: 0; font-size: 16px; color: var(--accent); }
  .filter { display: flex; gap: 6px; }
  .filter button {
    background: rgba(0,0,0,.3); border: 1px solid #3a4080; color: var(--dim);
    padding: 4px 12px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px;
  }
  .filter button.on { background: var(--accent); color: #2a1a00; border-color: var(--accent); font-weight: bold; }
  .picker-hint { color: var(--dim); font-size: 11px; margin-bottom: 8px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
    overflow-y: auto;
    padding-bottom: 20px;
    flex: 1;
  }
  .card {
    background: var(--panel2);
    border: 2px solid #2a3060;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .1s, border-color .15s;
    display: flex; flex-direction: column;
    position: relative;
  }
  .card:hover { transform: translateY(-2px); }
  .card.role-enemy { border-color: #5a2040; }
  .card.role-enemy:hover { border-color: var(--accent2); }
  .card.role-ally { border-color: #20446a; }
  .card.role-ally:hover { border-color: var(--ally); }
  .card .imgbox {
    width: 100%; aspect-ratio: 1/1;
    background: #0a0c18;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .card .imgbox img { width: 100%; height: 100%; object-fit: cover; }
  .card .imgbox .ph { font-size: 40px; opacity: .3; }
  .card .meta { padding: 6px 8px; }
  .card .meta .nm { font-weight: bold; font-size: 12px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta .st { color: var(--dim); font-size: 10px; margin-top: 2px; }
  .card .meta .sub { color: var(--dim); font-size: 9px; opacity: .7; }
  .card .role-tag {
    position: absolute; top: 4px; left: 4px;
    font-size: 9px; padding: 1px 5px; border-radius: 3px;
    background: var(--ally); color: #001a2e; font-weight: bold;
  }
  .card.role-enemy .role-tag { background: var(--accent2); color: #fff; }
  .empty {
    grid-column: 1/-1;
    text-align: center; color: var(--dim); font-size: 13px;
    padding: 40px 20px; line-height: 1.7;
  }

  /* ========== Submit Form ========== */
  #scene-submit { padding: 12px 20px; overflow-y: auto; }
  .form-wrap { max-width: 600px; margin: 0 auto; width: 100%; padding-bottom: 20px; }
  .form-wrap h2 { color: var(--accent); margin: 0 0 10px; text-align: center; font-size: 18px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 3px; }
  .field label .req { color: var(--accent2); }
  .text-input, .num-input {
    background: rgba(0,0,0,.3);
    border: 1px solid #3a4080;
    color: var(--text);
    font: inherit; font-size: 13px;
    padding: 7px 10px;
    border-radius: 6px;
    width: 100%;
  }
  .role-toggle { display: flex; gap: 6px; }
  .role-toggle label {
    flex: 1; text-align: center;
    background: var(--panel2); border: 2px solid #3a4080;
    border-radius: 8px; padding: 8px; cursor: pointer;
    font-weight: bold; transition: all .15s; font-size: 13px; margin: 0;
  }
  .role-toggle input { display: none; }
  .role-toggle input[value="ally"]:checked + label { border-color: var(--ally); background: rgba(75,196,255,.12); color: var(--ally); }
  .role-toggle input[value="enemy"]:checked + label { border-color: var(--accent2); background: rgba(255,93,143,.12); color: var(--accent2); }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 6px; }
  .file-pick {
    border: 2px dashed #3a4080; border-radius: 8px; padding: 10px;
    text-align: center; cursor: pointer; background: rgba(0,0,0,.2);
    transition: border-color .15s;
  }
  .file-pick:hover { border-color: var(--accent); }
  .file-pick.has { border-style: solid; padding: 4px; }
  .file-pick .preview { max-width: 100%; max-height: 180px; border-radius: 6px; display: block; margin: 0 auto; }
  .file-pick input { display: none; }
  .submit-bar { display: flex; gap: 8px; margin-top: 14px; position: sticky; bottom: 0; padding: 8px 0; background: linear-gradient(0deg, var(--panel) 60%, transparent); }
  .submit-bar .btn { flex: 1; padding: 10px; font-size: 14px; }

  /* ========== Battle ========== */
  #scene-battle { display: flex; flex-direction: column; }
  .battle-stage {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #0a0a14 center/cover no-repeat;
  }
  .battle-bg-img {
    position: absolute; inset: 0;
    background-size: cover; background-position: center bottom;
    filter: brightness(.85) saturate(1.05);
  }
  .battle-bg-img::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,.25) 0%, transparent 40%, rgba(0,0,0,.3) 100%);
  }
  .char-slot {
    position: absolute;
    bottom: 4%;
    width: 36%;
    height: 88%;
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 2;
  }
  .char-slot.ally { left: 2%; }
  .char-slot.enemy { right: 2%; }
  .char-sprite {
    width: 100%;
    height: 100%;
    display: flex; align-items: flex-end; justify-content: center;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,.6));
    animation: bob 3s ease-in-out infinite;
    transition: filter .2s;
  }
  .char-sprite img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .char-sprite.no-img { font-size: 140px; line-height: 1; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .char-sprite.hurt { animation: hurt .4s; }
  @keyframes hurt {
    0%, 100% { transform: translateX(0); filter: none; }
    20% { transform: translateX(-10px); filter: drop-shadow(0 0 12px #ff5b5b) hue-rotate(-30deg) brightness(1.5); }
    40% { transform: translateX(10px); filter: drop-shadow(0 0 12px #ff5b5b) hue-rotate(-30deg) brightness(1.5); }
    60% { transform: translateX(-6px); filter: drop-shadow(0 0 12px #ff5b5b); }
    80% { transform: translateX(4px); }
  }
  .char-sprite.dying { animation: die 1s forwards; }
  @keyframes die {
    0% { opacity: 1; transform: scale(1) rotate(0); }
    100% { opacity: 0; transform: scale(.3) rotate(180deg) translateY(60px); filter: blur(8px); }
  }

  /* Speech bubble */
  .bubble {
    position: absolute;
    bottom: 70%;
    background: #fff;
    color: #222;
    padding: 8px 14px;
    border-radius: 14px;
    font-size: 13px; font-weight: bold;
    max-width: 70%;
    white-space: pre-wrap;
    box-shadow: 0 4px 12px rgba(0,0,0,.5);
    z-index: 3;
    opacity: 0;
    transform: translateY(8px) scale(.85);
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    line-height: 1.4;
  }
  .bubble.show { opacity: 1; transform: translateY(0) scale(1); }
  .bubble::after {
    content: ""; position: absolute;
    bottom: -10px; width: 0; height: 0;
    border: 8px solid transparent;
    border-top-color: #fff;
  }
  .char-slot.ally .bubble { left: 50%; transform: translateX(-50%) translateY(8px) scale(.85); }
  .char-slot.ally .bubble.show { transform: translateX(-50%) translateY(0) scale(1); }
  .char-slot.ally .bubble::after { left: 30%; }
  .char-slot.enemy .bubble { right: 50%; transform: translateX(50%) translateY(8px) scale(.85); }
  .char-slot.enemy .bubble.show { transform: translateX(50%) translateY(0) scale(1); }
  .char-slot.enemy .bubble::after { right: 30%; left: auto; }

  /* HUD - HP/MP top corners */
  .hud {
    position: absolute;
    top: 12px;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.15);
    padding: 6px 10px;
    border-radius: 8px;
    z-index: 5;
    min-width: 180px;
  }
  .hud.ally { left: 12px; }
  .hud.enemy { right: 12px; text-align: right; }
  .hud .nm { font-size: 12px; font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud.ally .nm { color: var(--ally); }
  .hud.enemy .nm { color: var(--accent2); }
  .bar-row { display: flex; align-items: center; gap: 6px; font-size: 10px; margin: 2px 0; }
  .bar-row .lbl { color: var(--dim); width: 18px; }
  .hud.enemy .bar-row { flex-direction: row-reverse; }
  .bar {
    flex: 1; height: 8px;
    background: #0a0a18;
    border: 1px solid #3a4080;
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .bar > .fill { height: 100%; transition: width .4s; }
  .bar.hp > .fill { background: linear-gradient(180deg, var(--hp), #2a9050); }
  .bar.hp.low > .fill { background: linear-gradient(180deg, var(--hp-low), #802020); }
  .bar.mp > .fill { background: linear-gradient(180deg, var(--mp), #2070b0); }
  .bar .num { color: var(--text); font-size: 10px; min-width: 56px; text-align: center; text-shadow: 0 0 4px #000; }
  .hud.enemy .bar .num { text-align: center; }

  /* Battle bottom panel */
  .battle-panel {
    background: rgba(10,12,24,.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,.08);
    padding: 6px 12px;
    flex-shrink: 0;
    height: 28%;
    display: flex; flex-direction: column; gap: 6px;
  }
  .log {
    background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px; line-height: 1.45;
    flex: 1;
    overflow-y: auto;
    min-height: 0;
  }
  .log .line { margin: 0; }
  .log .line.dmg { color: #ff9090; }
  .log .line.heal { color: #8aff9a; }
  .log .line.crit { color: var(--accent); font-weight: bold; }
  .log .line.sys { color: var(--dim); font-style: italic; }
  .cmds {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .cmds .btn {
    padding: 10px 4px;
    font-size: 13px;
    background: linear-gradient(180deg, rgba(40,46,90,.9), rgba(20,24,50,.9));
    border: 1px solid #4a52a0;
  }
  .cmds .btn[data-cmd="attack"] { color: #fff; }
  .cmds .btn[data-cmd="magic"] { background: linear-gradient(180deg, rgba(60,40,120,.9), rgba(30,20,80,.9)); border-color: #8a60ff; }
  .cmds .btn[data-cmd="guard"] { background: linear-gradient(180deg, rgba(40,80,60,.9), rgba(20,50,30,.9)); border-color: #60c080; }
  .cmds .btn[data-cmd="run"] { background: linear-gradient(180deg, rgba(80,40,60,.9), rgba(50,20,30,.9)); border-color: #c06080; }

  /* Damage popup */
  .dmg-pop {
    position: absolute;
    font-size: 36px; font-weight: 900;
    color: var(--accent);
    text-shadow: 2px 2px 0 #5a3a00, 0 0 12px rgba(255,210,74,.8);
    pointer-events: none;
    animation: pop 1s forwards;
    z-index: 4;
  }
  .dmg-pop.crit { color: var(--accent2); text-shadow: 2px 2px 0 #5a0030; font-size: 48px; }
  .dmg-pop.miss { color: var(--dim); font-size: 28px; }
  .dmg-pop.heal { color: var(--hp); text-shadow: 2px 2px 0 #0a3a20; }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(20px) scale(.5); }
    20% { opacity: 1; transform: translateY(0) scale(1.2); }
    100% { opacity: 0; transform: translateY(-40px) scale(1); }
  }

  /* ========== End ========== */
  .end-wrap {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; text-align: center;
    padding: 20px; background: linear-gradient(180deg, var(--panel) 0%, #0a0c18 100%);
  }
  .end-title { font-size: 36px; font-weight: 900; color: var(--accent); text-shadow: 4px 4px 0 #b8860b; }
  .end-title.bad { color: var(--accent2); text-shadow: 4px 4px 0 #5a0030; }
  .result-box {
    background: var(--panel2);
    border: 1px solid #3a4080;
    border-radius: 10px;
    padding: 12px 22px;
    min-width: 280px; max-width: 480px;
    font-size: 13px; line-height: 1.7;
  }
  .result-box .row { display: flex; justify-content: space-between; gap: 20px; }
  .result-box .row b { color: var(--accent); }
  .share-box {
    background: rgba(0,0,0,.5); border: 1px solid #3a4080; border-radius: 6px;
    padding: 8px 10px; font-size: 12px; font-family: ui-monospace, monospace;
    white-space: pre-wrap; text-align: left;
    width: 90%; max-width: 420px;
    color: var(--text);
  }

  /* ========== Settings ========== */
  #scene-settings { padding: 30px; text-align: center; }
  #scene-settings h2 { color: var(--accent); margin: 0 0 14px; }
  #scene-settings .placeholder {
    background: var(--panel2); border: 1px dashed #3a4080;
    border-radius: 10px; padding: 30px; color: var(--dim);
    max-width: 480px; margin: 20px auto;
  }

  /* ========== Toast ========== */
  .toast {
    position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
    background: rgba(20,30,80,.95); border: 1px solid var(--accent);
    padding: 10px 18px; border-radius: 8px; z-index: 100;
    font-size: 13px; pointer-events: none;
    opacity: 0; transition: opacity .25s, transform .25s;
    backdrop-filter: blur(8px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
  .toast.err { border-color: var(--accent2); }
  .spinner {
    width: 14px; height: 14px; border: 2px solid #3a4080; border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite;
    display: inline-block; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="rotate-prompt">
  <div class="icon">📱</div>
  <div>端末を <strong>横向き</strong> にしてね</div>
  <div style="color:var(--dim);font-size:13px;">ギュラ鯖RPG は横画面でプレイします</div>
</div>
<div id="game">
  <header>
    <div class="title">🎮 ギュラ鯖RPG</div>
    <button class="home" id="btnHome" style="display:none;">🏠 タイトル</button>
  </header>
  <main>
    <!-- Title -->
    <section class="scene active" id="scene-title">
      <div class="title-bg" id="titleBg"></div>
      <div class="title-content">
        <div class="logo">ギュラ鯖<small>RPG</small></div>
        <div class="title-cover">
          <img id="coverImg" src="images/slime.jpg" alt="">
        </div>
        <div class="title-actions">
          <input id="playerName" class="title-name" maxlength="12" placeholder="あなたの名前 (任意)">
          <button class="btn huge" data-menu="pickAlly">⚔ 対戦</button>
          <div class="title-menu-row">
            <button class="btn" data-menu="submit">📷 画像を投稿</button>
            <button class="btn" data-menu="gallery">📚 みんなの画像を見る</button>
            <button class="btn" data-menu="settings">⚙️ 設定</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Picker -->
    <section class="scene" id="scene-picker">
      <div class="picker-head">
        <h2 id="pickerTitle">キャラを選ぶ</h2>
        <div class="filter">
          <button data-filter="ally" class="on">⚔️ 仲間</button>
          <button data-filter="enemy">👹 敵</button>
          <button data-filter="all">全部</button>
        </div>
      </div>
      <div id="pickerHint" class="picker-hint"></div>
      <div class="grid" id="grid"></div>
    </section>

    <!-- Submit -->
    <section class="scene" id="scene-submit">
      <div class="form-wrap">
        <h2>📷 キャラを投稿</h2>
        <div class="field">
          <label>役割 <span class="req">*</span></label>
          <div class="role-toggle">
            <input type="radio" name="role" id="role-ally" value="ally" checked>
            <label for="role-ally">⚔️ 仲間</label>
            <input type="radio" name="role" id="role-enemy" value="enemy">
            <label for="role-enemy">👹 敵</label>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>名前 <span class="req">*</span></label>
            <input id="fName" class="text-input" maxlength="20" placeholder="例：勇者ロト">
          </div>
          <div class="field">
            <label>投稿者名（任意）</label>
            <input id="fSubmitter" class="text-input" maxlength="20" placeholder="例：かいてん">
          </div>
        </div>
        <div class="field">
          <label>ステータス <span class="req">*</span> <span style="color:var(--dim);">(HP/攻撃/防御)</span></label>
          <div class="row3">
            <input id="fHP" class="num-input" type="number" min="1" max="9999" placeholder="HP 50-200">
            <input id="fAtk" class="num-input" type="number" min="1" max="999" placeholder="攻撃 5-20">
            <input id="fDef" class="num-input" type="number" min="0" max="999" placeholder="防御 0-10">
          </div>
        </div>
        <div class="field">
          <label>セリフ（任意・攻撃時に吹き出しで表示）</label>
          <input id="fTaunt" class="text-input" maxlength="50" placeholder="例：くらえ！">
        </div>
        <div class="field">
          <label>画像（任意・PNG/JPG・透過推奨）</label>
          <div class="file-pick" id="filePick">
            <input type="file" id="fImage" accept="image/*">
            <div id="filePickInner">📷 タップして画像を選ぶ</div>
          </div>
        </div>
        <div class="submit-bar">
          <button class="btn" data-menu="title">キャンセル</button>
          <button class="btn primary" id="btnSubmit">投稿する</button>
        </div>
      </div>
    </section>

    <!-- Battle -->
    <section class="scene" id="scene-battle">
      <div class="battle-stage" id="battleStage">
        <div class="battle-bg-img" id="battleBg"></div>
        <div class="hud ally" id="hudAlly">
          <div class="nm" id="allyNm">仲間</div>
          <div class="bar-row"><span class="lbl">HP</span><div class="bar hp" id="allyHpBar"><div class="fill" id="allyHpFill"></div></div><span class="num" id="allyHpTxt">0/0</span></div>
          <div class="bar-row"><span class="lbl">MP</span><div class="bar mp" id="allyMpBar"><div class="fill" id="allyMpFill"></div></div><span class="num" id="allyMpTxt">0/0</span></div>
        </div>
        <div class="hud enemy" id="hudEnemy">
          <div class="nm" id="enemyNm">敵</div>
          <div class="bar-row"><span class="num" id="enemyHpTxt">0/0</span><div class="bar hp" id="enemyHpBar"><div class="fill" id="enemyHpFill"></div></div><span class="lbl">HP</span></div>
        </div>
        <div class="char-slot ally">
          <div class="char-sprite" id="allySprite"></div>
          <div class="bubble" id="allyBubble"></div>
        </div>
        <div class="char-slot enemy">
          <div class="char-sprite" id="enemySprite"></div>
          <div class="bubble" id="enemyBubble"></div>
        </div>
      </div>
      <div class="battle-panel">
        <div class="log" id="log"></div>
        <div class="cmds">
          <button class="btn" data-cmd="attack">⚔️ こうげき</button>
          <button class="btn" data-cmd="magic">✨ まほう</button>
          <button class="btn" data-cmd="guard">🛡️ ぼうぎょ</button>
          <button class="btn" data-cmd="run">🏃 にげる</button>
        </div>
      </div>
    </section>

    <!-- End -->
    <section class="scene" id="scene-end">
      <div class="end-wrap" id="endWrap"></div>
    </section>

    <!-- Settings (placeholder) -->
    <section class="scene" id="scene-settings">
      <h2>⚙️ 設定</h2>
      <div class="placeholder">
        まだ設定項目はないよ。<br>
        今後ここにBGM・効果音・難易度などを置く予定。
      </div>
      <button class="btn" data-menu="title">← タイトルへ戻る</button>
    </section>

    <div class="toast" id="toast"></div>
  </main>
</div>

<script>
//================= Supabase =================
const SUPABASE_URL = 'https://iulhtentzliohwylcsqo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9iTuPD3fEDazZYEMWyijWg_0WxMv_9B';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

//================= 既定キャラ（DBが空でも遊べる用）=================
const DEFAULTS = [
  { role:'ally', name:'ふつうの勇者', hp:80, atk:10, def:3, taunt:'いくぞ！', image_url:null, submitter:'(プリセット)' },
  { role:'enemy', name:'チャットスライム', hp:40, atk:6, def:0, taunt:'ﾌﾞﾙﾙ…', image_url:null, submitter:'(プリセット)' },
];

//================= 背景 =================
const BG_LIST = [ 'images/bg/bg_purple.jpg', 'images/bg/bg_volcano.jpg', 'images/bg/bg_forest.jpg' ];

//================= 状態 =================
const G = {
  playerName: '',
  myChar: null, oppChar: null,
  characters: [], loaded: false,
  pHP:0, pHPMax:0, pMP:3, pMPMax:5,
  eHP:0, eHPMax:0,
  totalDmg:0, turns:0, startTime:0,
  guarding:false,
  pickerStage:null, pickerFilter:'ally',
};

//================= ユーティリティ =================
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const rand = (a,b)=> a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const esc = s => String(s||'').replace(/[<>&"]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));

function show(id){
  $$('.scene').forEach(s=>s.classList.remove('active'));
  $('#scene-'+id).classList.add('active');
  $('#btnHome').style.display = (id === 'title') ? 'none' : 'flex';
}
function toast(msg, isErr){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 2400);
}

//================= DB =================
async function loadCharacters(){
  const { data, error } = await sb.from('characters').select('*').order('created_at', { ascending: false });
  if (error) {
    console.warn('DB error:', error);
    toast('読み込みに失敗（プリセットだけ表示）', true);
    G.characters = [...DEFAULTS];
  } else {
    G.characters = [...(data||[]), ...DEFAULTS];
  }
  G.loaded = true;
}
async function uploadImage(file){
  if (!file) return null;
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const safe = /^(jpe?g|png|gif|webp)$/.test(ext) ? ext : 'jpg';
  const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.${safe}`;
  const { error } = await sb.storage.from('characters').upload(path, file, { cacheControl: '3600', upsert: false });
  if (error) throw error;
  const { data } = sb.storage.from('characters').getPublicUrl(path);
  return data.publicUrl;
}
async function submitCharacter(data){
  const { error } = await sb.from('characters').insert(data);
  if (error) throw error;
}

//================= タイトル/メニュー =================
$('#btnHome').addEventListener('click', goTitle);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-menu]');
  if (!el) return;
  G.playerName = ($('#playerName')?.value || '').trim().slice(0,12);
  const m = el.dataset.menu;
  if (m === 'pickAlly') goPicker('ally');
  else if (m === 'submit') goSubmit();
  else if (m === 'gallery') goPicker('browse');
  else if (m === 'settings') show('settings');
  else if (m === 'title') goTitle();
});

function goTitle(){
  G.myChar = null; G.oppChar = null;
  G.pickerStage = null;
  show('title');
}

//================= ピッカー =================
async function goPicker(stage){
  G.pickerStage = stage;
  G.pickerFilter = stage === 'enemy' ? 'enemy' : (stage === 'browse' ? 'all' : 'ally');
  if (stage === 'ally') {
    $('#pickerTitle').textContent = '① あなたのキャラを選ぶ';
    $('#pickerHint').innerHTML = '<span style="color:var(--ally);">仲間</span>を選んで戦闘準備';
  } else if (stage === 'enemy') {
    $('#pickerTitle').textContent = `② 相手を選ぶ (自分: ${esc(G.myChar.name)})`;
    $('#pickerHint').innerHTML = '<span style="color:var(--accent2);">敵</span>を選んで開始！';
  } else {
    $('#pickerTitle').textContent = '📚 みんなの画像';
    $('#pickerHint').textContent = '（鑑賞モード）';
  }
  $$('.filter button').forEach(b=>b.classList.toggle('on', b.dataset.filter === G.pickerFilter));
  show('picker');
  if (!G.loaded) {
    $('#grid').innerHTML = '<div class="empty"><div class="spinner"></div> 読み込み中…</div>';
    await loadCharacters();
  }
  renderGrid();
}
$$('.filter button').forEach(b=>{
  b.addEventListener('click', ()=>{
    if (G.pickerStage === 'ally' || G.pickerStage === 'enemy') return;
    G.pickerFilter = b.dataset.filter;
    $$('.filter button').forEach(x=>x.classList.toggle('on', x.dataset.filter === G.pickerFilter));
    renderGrid();
  });
});
function renderGrid(){
  const grid = $('#grid');
  let list = G.characters;
  if (G.pickerStage === 'ally') list = list.filter(c=>c.role==='ally');
  else if (G.pickerStage === 'enemy') list = list.filter(c=>c.role==='enemy');
  else if (G.pickerFilter !== 'all') list = list.filter(c=>c.role===G.pickerFilter);
  if (list.length === 0) {
    grid.innerHTML = `<div class="empty">まだキャラがいないみたい。<br><button class="btn" style="margin-top:10px;" data-menu="submit">📝 投稿してみる</button></div>`;
    return;
  }
  grid.innerHTML = list.map((c,i)=>`
    <div class="card role-${c.role}" data-idx="${i}">
      <div class="role-tag">${c.role==='enemy'?'敵':'仲間'}</div>
      <div class="imgbox">${c.image_url ? `<img src="${esc(c.image_url)}" alt="" loading="lazy">` : '<span class="ph">'+(c.role==='enemy'?'👹':'⚔️')+'</span>'}</div>
      <div class="meta">
        <div class="nm">${esc(c.name)}</div>
        <div class="st">HP${c.hp} ⚔${c.atk} 🛡${c.def||0}</div>
        ${c.submitter ? `<div class="sub">by ${esc(c.submitter)}</div>` : ''}
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const i = +card.dataset.idx;
      onPickCharacter(list[i]);
    });
  });
}
function onPickCharacter(c){
  if (G.pickerStage === 'ally') { G.myChar = c; goPicker('enemy'); }
  else if (G.pickerStage === 'enemy') { G.oppChar = c; startBattle(); }
  else {
    if (confirm(`「${c.name}」と戦う？\n（${c.role==='enemy'?'相手':'仲間'}としてセット）`)) {
      if (c.role === 'ally') { G.myChar = c; goPicker('enemy'); }
      else { G.oppChar = c; goPicker('ally'); }
    }
  }
}

//================= 投稿 =================
function goSubmit(){
  show('submit');
  $('#fName').value = ''; $('#fHP').value=''; $('#fAtk').value=''; $('#fDef').value='';
  $('#fTaunt').value=''; $('#fImage').value=''; $('#fSubmitter').value = G.playerName || '';
  $('#filePickInner').innerHTML = '📷 タップして画像を選ぶ';
  $('#filePick').classList.remove('has');
  $('#role-ally').checked = true;
}
$('#filePick').addEventListener('click', e=>{ if (e.target.tagName !== 'INPUT') $('#fImage').click(); });
$('#fImage').addEventListener('change', e=>{
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 8 * 1024 * 1024) { toast('8MB以下にしてください', true); $('#fImage').value=''; return; }
  const r = new FileReader();
  r.onload = ev => {
    $('#filePickInner').innerHTML = `<img src="${ev.target.result}" class="preview"><div style="font-size:11px;color:var(--dim);margin-top:4px;">タップで変更</div>`;
    $('#filePick').classList.add('has');
  };
  r.readAsDataURL(f);
});
$('#btnSubmit').addEventListener('click', async ()=>{
  const role = document.querySelector('input[name="role"]:checked').value;
  const name = $('#fName').value.trim();
  const hp = parseInt($('#fHP').value, 10);
  const atk = parseInt($('#fAtk').value, 10);
  const def = parseInt($('#fDef').value, 10) || 0;
  const taunt = $('#fTaunt').value.trim();
  const submitter = $('#fSubmitter').value.trim() || G.playerName || null;
  const file = $('#fImage').files[0] || null;
  if (!name) return toast('名前は必須', true);
  if (!(hp >= 1 && hp <= 9999)) return toast('HPは1〜9999', true);
  if (!(atk >= 1 && atk <= 999)) return toast('攻撃は1〜999', true);
  if (!(def >= 0 && def <= 999)) return toast('防御は0〜999', true);
  $('#btnSubmit').disabled = true;
  $('#btnSubmit').innerHTML = '<span class="spinner"></span> 送信中…';
  try {
    let image_url = null;
    if (file) image_url = await uploadImage(file);
    await submitCharacter({ role, name, hp, atk, def, taunt: taunt||null, image_url, submitter });
    toast('投稿しました！');
    G.loaded = false; // 次のリストでリロード
    setTimeout(()=>goTitle(), 700);
  } catch (e) {
    console.error(e);
    toast('投稿失敗：' + (e.message || e), true);
  } finally {
    $('#btnSubmit').disabled = false;
    $('#btnSubmit').textContent = '投稿する';
  }
});

//================= バトル =================
const FUNNY = {
  attackGeneric: ['{p} は {e} に つっこみを いれた！','{p} は キーボードで 殴った！','{p} の キレッキレ レスポンス！','{p} の 痛烈マジレス！'],
  miss: ['{p} の こうげきは スルーされた…','{p} の こうげきは ROM専に かわされた！','{p} は タイポした！'],
  crit: ['💥 痛恨の 正論！','💥 限界突破の マジレス！','💥 場が 凍りつく ひとこと！'],
  enemyAtk: ['{e} は {p} に 煽りレスを ぶつけた！','{e} の マウントが 炸裂！','{e} は {p} に 既読スルーを かました！'],
  enemyMiss: ['{e} の こうげきは 圏外！','{e} は 自滅した…'],
  guard: ['{p} は 通知を ミュートした！','{p} は ROMに 徹した！','{p} は 防御の構え！'],
};
const fmt = (t, c) => t.replace('{p}', c.p).replace('{e}', c.e);

function startBattle(){
  const me = G.myChar, opp = G.oppChar;
  G.pHPMax = me.hp; G.pHP = me.hp;
  G.eHPMax = opp.hp; G.eHP = opp.hp;
  G.pMP = 3; G.pMPMax = 5;
  G.totalDmg = 0; G.turns = 0; G.startTime = Date.now();
  G.guarding = false;
  // BG random
  const bg = pick(BG_LIST);
  $('#battleBg').style.backgroundImage = `url(${bg})`;
  // chars
  $('#allyNm').textContent = me.name;
  $('#enemyNm').textContent = opp.name;
  $('#allySprite').className = 'char-sprite' + (me.image_url ? '' : ' no-img');
  $('#allySprite').innerHTML = me.image_url ? `<img src="${esc(me.image_url)}" alt="">` : '⚔️';
  $('#enemySprite').className = 'char-sprite' + (opp.image_url ? '' : ' no-img');
  $('#enemySprite').innerHTML = opp.image_url ? `<img src="${esc(opp.image_url)}" alt="">` : '👹';
  $('#log').innerHTML = '';
  refreshBars();
  log(`▼ ${opp.name} が あらわれた！`, 'sys');
  if (opp.taunt) showBubble('enemy', opp.taunt, 1500);
  enableCmds(true);
  show('battle');
}

function refreshBars(){
  const eP = Math.max(0, G.eHP/G.eHPMax*100);
  $('#enemyHpFill').style.width = eP+'%';
  $('#enemyHpTxt').textContent = `${Math.max(0,G.eHP)}/${G.eHPMax}`;
  $('#enemyHpBar').classList.toggle('low', eP < 30);
  const pP = Math.max(0, G.pHP/G.pHPMax*100);
  $('#allyHpFill').style.width = pP+'%';
  $('#allyHpTxt').textContent = `${Math.max(0,G.pHP)}/${G.pHPMax}`;
  $('#allyHpBar').classList.toggle('low', pP < 30);
  const mP = Math.max(0, G.pMP/G.pMPMax*100);
  $('#allyMpFill').style.width = mP+'%';
  $('#allyMpTxt').textContent = `${G.pMP}/${G.pMPMax}`;
}
function enableCmds(on){
  $$('.cmds .btn').forEach(b=>{
    b.disabled = !on;
    if (b.dataset.cmd === 'magic') b.disabled = !on || G.pMP < 3;
  });
}
function log(text, cls=''){
  const p = document.createElement('p');
  p.className = 'line ' + cls;
  p.textContent = text;
  $('#log').appendChild(p);
  $('#log').scrollTop = $('#log').scrollHeight;
}
function showBubble(side, text, ms=1800){
  const b = $('#' + side + 'Bubble');
  b.textContent = text;
  b.classList.add('show');
  clearTimeout(b._t);
  b._t = setTimeout(()=>b.classList.remove('show'), ms);
}
function popDmg(text, type='', side='enemy'){
  const stage = $('#battleStage');
  const slot = stage.querySelector('.char-slot.' + side);
  const r = slot.getBoundingClientRect();
  const sr = stage.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'dmg-pop ' + type;
  el.textContent = text;
  el.style.left = (r.left - sr.left + r.width/2 - 20) + 'px';
  el.style.top = (r.top - sr.top + r.height*0.3) + 'px';
  stage.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}

$$('.cmds .btn').forEach(b=> b.addEventListener('click', ()=>handleCmd(b.dataset.cmd)));

async function handleCmd(cmd){
  enableCmds(false);
  G.turns++;
  const me = G.myChar, opp = G.oppChar;
  const ctx = { p: me.name, e: opp.name };

  if (cmd === 'attack') {
    if (me.taunt) showBubble('ally', me.taunt);
    const miss = Math.random() < 0.08;
    if (miss) {
      log(fmt(pick(FUNNY.miss), ctx), 'sys');
      popDmg('MISS', 'miss');
    } else {
      const crit = Math.random() < 0.18;
      let dmg = Math.max(1, me.atk - (opp.def||0) + rand(-2,3));
      if (crit) dmg = Math.floor(dmg * 1.8);
      G.eHP -= dmg; G.totalDmg += dmg;
      $('#enemySprite').classList.remove('hurt'); void $('#enemySprite').offsetWidth;
      $('#enemySprite').classList.add('hurt');
      popDmg(dmg, crit ? 'crit' : '');
      if (crit) log(pick(FUNNY.crit), 'crit');
      log(fmt(pick(FUNNY.attackGeneric), ctx) + ` ${dmg} のダメージ！`, 'dmg');
    }
  }
  else if (cmd === 'magic') {
    if (G.pMP < 3) { enableCmds(true); return; }
    G.pMP -= 3;
    showBubble('ally', '✨ まほうを とけ！');
    const dmg = Math.max(1, Math.floor(me.atk * 2.2) - Math.floor((opp.def||0)/2) + rand(0,6));
    G.eHP -= dmg; G.totalDmg += dmg;
    $('#enemySprite').classList.add('hurt');
    popDmg(dmg, 'crit');
    log(`✨ ${me.name} の まほう！ ${dmg} のダメージ！`, 'crit');
  }
  else if (cmd === 'guard') {
    G.guarding = true;
    const heal = Math.min(G.pHPMax - G.pHP, rand(3,7));
    if (heal > 0) { G.pHP += heal; popDmg('+'+heal, 'heal', 'ally'); }
    log(fmt(pick(FUNNY.guard), ctx) + (heal? ` (HPが ${heal} 回復)`:''), 'heal');
  }
  else if (cmd === 'run') {
    log('にげだした…', 'sys');
    await sleep(700);
    goTitle();
    return;
  }
  refreshBars();
  await sleep(700);
  if (G.eHP <= 0) {
    $('#enemySprite').classList.add('dying');
    log(`${opp.name} を たおした！`, 'crit');
    await sleep(900);
    endBattle(true);
    return;
  }
  await enemyTurn();
  if (G.pHP <= 0) {
    log(`${me.name} は ちからつきた…`, 'sys');
    await sleep(900);
    endBattle(false);
    return;
  }
  G.guarding = false;
  enableCmds(true);
}
async function enemyTurn(){
  const me = G.myChar, opp = G.oppChar;
  const ctx = { p: me.name, e: opp.name };
  if (Math.random() < 0.08) {
    log(fmt(pick(FUNNY.enemyMiss), ctx), 'sys');
    return;
  }
  if (opp.taunt && Math.random() < 0.4) showBubble('enemy', opp.taunt);
  let dmg = Math.max(1, opp.atk - (me.def||0) + rand(-2,3));
  if (G.guarding) dmg = Math.max(0, Math.floor(dmg * 0.4));
  G.pHP -= dmg;
  popDmg(dmg, '', 'ally');
  $('#allySprite').classList.remove('hurt'); void $('#allySprite').offsetWidth;
  $('#allySprite').classList.add('hurt');
  log(fmt(pick(FUNNY.enemyAtk), ctx) + ` ${dmg} のダメージ！`, 'dmg');
  refreshBars();
}

//================= 結果 =================
function endBattle(win){
  const sec = Math.floor((Date.now() - G.startTime)/1000);
  const mm = String(Math.floor(sec/60)).padStart(2,'0');
  const ss = String(sec%60).padStart(2,'0');
  const me = G.myChar, opp = G.oppChar;
  const pn = G.playerName || '名無しの鯖民';
  $('#endWrap').innerHTML = `
    <div class="end-title ${win?'':'bad'}">${win?'🎉 勝利！':'💀 やられた…'}</div>
    <div style="font-size:13px;color:var(--dim);">${win ? `${esc(opp.name)} を倒した！` : `${esc(opp.name)} に やられた…`}</div>
    <div class="result-box">
      <div class="row"><span>プレイヤー</span><b>${esc(pn)}</b></div>
      <div class="row"><span>使用キャラ</span><b>${esc(me.name)}</b></div>
      <div class="row"><span>相手</span><b>${esc(opp.name)}</b></div>
      <div class="row"><span>総ダメージ</span><b>${G.totalDmg}</b></div>
      <div class="row"><span>ターン</span><b>${G.turns}</b></div>
      <div class="row"><span>タイム</span><b>${mm}:${ss}</b></div>
    </div>
    <textarea class="share-box" id="shareBox" rows="3" readonly>${esc(pn)} は「${esc(me.name)}」で「${esc(opp.name)}」と戦って ${win?'勝利！':'敗北…'}\n総ダメージ ${G.totalDmg} / ${G.turns}ターン / ${mm}:${ss}\n#ギュラ鯖RPG</textarea>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
      <button class="btn" id="btnCopy">📋 結果コピー</button>
      <button class="btn ally" id="btnRematch">🔁 もう一度</button>
      <button class="btn primary" id="btnNewPick">⚔ 別のキャラで</button>
    </div>`;
  $('#btnCopy').addEventListener('click', ()=>{
    const ta = $('#shareBox'); ta.select(); document.execCommand('copy');
    $('#btnCopy').textContent = '✅ コピーした';
    setTimeout(()=>$('#btnCopy').textContent = '📋 結果コピー', 1500);
  });
  $('#btnRematch').addEventListener('click', startBattle);
  $('#btnNewPick').addEventListener('click', ()=>goPicker('ally'));
  show('end');
}

// バックグラウンドでキャラロード（先取り）
loadCharacters();
</script>
</body>
